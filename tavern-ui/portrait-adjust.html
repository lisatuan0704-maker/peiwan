<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名簿角色位置調整｜Tiny Tavern</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3edf4;color:#53465e;font-family:system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1450px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}p{line-height:1.7;margin:8px 0 18px;color:#76667f}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}.preview,.controls{border:1px solid #d0bfd9;border-radius:16px;background:#fffafc;padding:16px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar label{display:flex;gap:8px;align-items:center;font-size:13px}.scroll{overflow:auto;background:#e4dae9;border-radius:12px}iframe{display:block;width:900px;height:700px;border:0;background:#f9f4fa}button,select,input,textarea{font:inherit}button,select{border:1px solid #b6a2c7;background:#fff;color:#65516e;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{background:#f0e5f6}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a982c7;outline-offset:2px}button[aria-pressed=true],.primary{background:#80618f;color:white;border-color:#80618f}.characters{display:flex;gap:6px;margin-bottom:16px}.characters button{flex:1;padding:10px 4px;font-size:13px}.control{display:block;margin:20px 0}.control-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.control-head input{width:90px;border:1px solid #cbbbd6;border-radius:7px;padding:6px;color:#53465e}input[type=range]{width:100%;accent-color:#926da4}.hint{font-size:12px;line-height:1.7;color:#84718d}fieldset{border:0;padding:0;margin:0}fieldset:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions button{flex:1}.export{margin-top:20px;border-top:1px solid #e5dbea;padding-top:16px}textarea{width:100%;height:155px;resize:vertical;border:1px solid #cbbbd6;border-radius:9px;padding:10px;font-family:monospace;font-size:11px;background:#fcf9fe;color:#5a4766}.status{min-height:44px;font-size:13px;line-height:1.6;color:#796087}.saved{font-size:12px;color:#92789c}.badge{font-size:11px;letter-spacing:1px;color:#9c7aa7;margin-bottom:7px}.controls h2{font-size:18px;margin:0 0 10px}.notice{font-size:12px;padding:10px;background:#f1e9f5;border-radius:8px;margin-bottom:16px}@media(max-width:1000px){.workspace{grid-template-columns:1fr}.controls{max-width:none}.characters{max-width:450px}main{padding:14px}.control{display:inline-block;width:calc(33.33% - 12px);margin:12px 9px 12px 0;vertical-align:top}}@media(max-width:580px){.control{display:block;width:100%}h1{font-size:22px}}
</style></head><body><main>
<div class="badge">TINY TAVERN / PORTRAIT STUDIO</div><h1>名簿角色位置調整</h1><p>先點角色，再拖曳圖片或微調數字。調好三位後，複製設定貼給我，就能套回正式名簿。</p>
<div class="workspace"><section class="preview" aria-label="名簿預覽"><div class="toolbar"><label>預覽寬度 <select id="previewWidth"><option value="900">桌面 · 900</option><option value="760">小桌面 · 760</option><option value="600">平板 · 600</option><option value="390">手機 · 390</option></select></label><span class="hint">直接在角色那一列拖曳；只調圖片，框線與列高固定。</span></div><div class="scroll"><iframe id="preview" src="index.html?v=226" title="可拖曳的名簿角色預覽"></iframe></div></section>
<aside class="controls"><h2>調整角色</h2><div class="characters" role="group" aria-label="選擇角色"><button data-cast="KABUKI" aria-pressed="true">卡布</button><button data-cast="MOMO" aria-pressed="false">MOMO</button><button data-cast="RIRA" aria-pressed="false">縭</button></div><div class="notice">圖片可以超出框外，名簿只顯示框內部分。想看更多傘或髮尾，可調整大小與位置。</div>
<fieldset id="fields" disabled><label class="control"><span class="control-head">左右位置 <input id="xNumber" type="number" min="-100" max="200" step="0.1" aria-label="左右位置數值"></span><input id="xRange" type="range" min="-100" max="200" step="0.1" aria-label="左右位置"><span class="hint">數字越大，越靠右。</span></label>
<label class="control"><span class="control-head">上下位置 <input id="yNumber" type="number" min="-500" max="500" step="0.1" aria-label="上下位置數值"></span><input id="yRange" type="range" min="-500" max="500" step="0.1" aria-label="上下位置"><span class="hint">數字越大，越靠下。</span></label>
<label class="control"><span class="control-head">大小（%） <input id="scaleNumber" type="number" min="10" max="300" step="1" aria-label="大小數值"></span><input id="scaleRange" type="range" min="10" max="300" step="1" aria-label="大小"><span class="hint">100% 是開啟時的原本大小。</span></label>
<div class="actions"><button id="resetOne">還原這位</button><button id="resetAll">全部還原</button></div></fieldset>
<p class="saved" id="saved">正在載入預覽…</p><div class="export"><div class="actions"><button class="primary" id="copy" disabled>複製三位設定</button><button id="download" disabled>下載設定</button></div><p class="status" role="status" id="status">只會保存到這個瀏覽器，不會直接修改正式頁面。</p><label class="hint" for="output">也可以直接全選下方文字，複製傳給我。</label><textarea id="output" readonly aria-label="三位角色設定"></textarea></div>
</aside></div></main><script src="portrait-adjust.js?v=2"></script></body></html>
