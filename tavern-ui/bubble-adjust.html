<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>對話框校正室｜Tiny Tavern</title><link rel="stylesheet" href="assets/fonts/lineseed.css"><link rel="stylesheet" href="bubble-adjust.css?v=242"></head>
<body class="artBub bub3s"><main><header><span class="eyebrow">TINY TAVERN / BUBBLE STUDIO</span><h1>把對話框調成你喜歡的樣子。</h1><p>拖曳對話框移位置，拉右下角改大小。文字和框可以分開調，完成後複製數值傳給我。</p></header>
<div class="workspace"><section class="preview"><div class="toolbar"><label>對話框 <select id="frame"><option value="10">花框</option><option value="12">餅乾框</option><option value="11">泡泡框</option><option value="13">俏皮花貓框</option><option value="14">夢落星間</option></select></label><label>預覽放大 <select id="zoom"><option value="1">100%</option><option value="1.5">150%</option><option value="2" selected>200%</option><option value="3">300%</option></select></label><label><input type="checkbox" id="guides" checked>顯示輔助線</label></div>
<div id="viewport"><div id="scene"><div class="scenery" aria-hidden="true"><img src="../img/lobby-layers-v218/base.png" alt=""><img src="../img/lobby-layers-v218/fixtures.png" alt=""><img src="../img/lobby-layers-v218/stools.png" alt=""><img src="../img/lobby-layers-v218/food.png" alt=""></div><div class="center-guide"></div><div id="actor"><canvas id="doll" width="64" height="64" aria-label="大廳示範角色"></canvas><span class="nameplate">校正用小人</span></div><div id="bubble" tabindex="0" role="group" aria-label="可拖曳的對話框，方向鍵移動位置"><canvas id="frameCanvas" aria-hidden="true"></canvas><div id="textBox"><span id="bubbleText"></span></div><button id="resize" aria-label="拖曳調整對話框寬高" title="拖曳調整寬高"></button></div></div></div>
<p class="preview-note">預覽放大只方便你看清楚，不會改變匯出的數值。小人大小固定，方便比較框的比例。</p><div class="sample"><label for="sampleText">測試對話</label><textarea id="sampleText" maxlength="180" rows="2">安安</textarea><div class="sample-buttons"><button data-sample="安安">短句</button><button data-sample="今天也一起玩吧！">一般句子</button><button data-sample="大家晚上好，今天想一起玩什麼？我可以陪你聊天，也可以一起打遊戲。">長句測試</button><button data-sample="安安！
今天也請多多指教。">兩行測試</button></div></div><p id="overflow" role="status"></p><details><summary>怎麼調比較方便？</summary><p>先用短句調整框與小人的距離，再用長句檢查文字是否放得下。方向鍵可移動選中的對話框，按住 Shift 每次移動 5 格。每一款框各自保存設定。</p></details></section>
<aside class="controls"><div class="control-title"><h2 id="frameName">花框</h2><span>即時預覽</span></div><fieldset id="fields" disabled><div id="mainControls"></div><label class="check"><input id="lockRatio" type="checkbox">拉角落時鎖定框的比例</label><details><summary>進階：文字位置與可用範圍</summary><div id="advancedControls"></div></details><div class="actions"><button id="reset">還原這款</button><button id="resetAll">全部還原</button></div></fieldset><p id="saved" class="hint">正在載入原始素材…</p><div class="export"><h2>調好了，傳給我</h2><p>五款框的設定會一起匯出；只會暫存在此瀏覽器，不會更動正式大廳。</p><div class="actions"><button id="copy" class="primary" disabled>複製全部數值</button><button id="download" disabled>下載設定</button></div><p id="status" role="status" aria-live="polite"></p><textarea id="output" readonly aria-label="全部對話框設定" spellcheck="false"></textarea><details><summary>載入之前的數值</summary><textarea id="importText" placeholder="貼上之前匯出的整份設定" aria-label="貼上設定"></textarea><button id="import">載入設定</button></details></div></aside></div></main>
<div id="measure" class="npc" aria-hidden="true"></div><script src="bubble-source.js?v=242"></script><script src="bubble-doll.js?v=242"></script><script src="bubble-adjust.js?v=242"></script></body></html>
