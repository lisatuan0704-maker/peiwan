<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飲料卡位置調整</title><style>
*{box-sizing:border-box}body{margin:0;background:#282237;color:#f8e5ef;font:16px system-ui;padding:24px}main{max-width:960px;margin:auto}h1{font-size:25px}button,select,input{font:inherit}button,select{padding:10px;border-radius:9px;border:1px solid #b79abb;background:#51405f;color:white}nav,.controls{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:8px}#stage{position:relative;width:100%;height:430px;background:repeating-linear-gradient(0deg,#675044 0 49px,#8d6954 50px 52px);border:2px solid #b79abb;border-radius:18px;overflow:hidden}#stage:after{content:'地板基準線';position:absolute;left:0;right:0;top:330px;border-top:1px dashed #efd7c6;color:#efd7c6;font-size:12px;pointer-events:none}#actor{position:absolute;left:calc(50% - 80px);top:170px;width:160px;height:160px;object-fit:contain;image-rendering:pixelated}#pet{position:absolute;object-fit:contain;image-rendering:pixelated;touch-action:none;cursor:move;transform:translate(-50%,-100%)}p{line-height:1.7;color:#d7bfd8}output{font-variant-numeric:tabular-nums}textarea{width:100%;height:120px;background:#1c1927;color:#f8e5ef;border:1px solid #8d6d96;padding:12px}#status{min-height:28px}#stage{max-width:420px;height:510px;margin:auto;background:radial-gradient(ellipse at 50% 40%,#80608c,#2d2843);border:1px solid #e4b6da;box-shadow:inset 0 0 0 7px #ffffff0a}#stage:after{display:none}#actor,#pet,#drink{position:absolute;object-fit:contain;transform:translate(-50%,-100%);cursor:move;touch-action:none}#pet{transform:translate(-50%,-100%) scaleX(-1)}#stage img[data-selected=true]{outline:1px dashed #f9daff} </style><main><h1>飲料卡 · 位置與比例調整</h1><p>拖曳選取的素材改位置，拉動滑桿改大小。可分別選擇角色、寵物或飲料，再拖曳或調整滑桿。設定只存在這台瀏覽器；按「匯出設定」下載後交給我套用到正式網站。</p><nav><a href="companion-adjust.html" style="color:#f8e5ef">← 寵物比例調整</a><select id="who"><option value="kabuki">蕪 · 布布</option><option value="rira">縭 · 鬼鬼</option><option value="momo">桃 · 燈燈</option></select><select id="part"><option value="pet">寵物</option><option value="staff">角色</option><option value="drink">飲料</option></select><button id="reset">重設這隻</button><button id="save">儲存本機預覽</button><button id="export">匯出設定</button></nav><div id="stage"><img id="drink" alt="飲料" draggable="false"><img id="actor" alt="角色比例參照" draggable="false"><img id="pet" alt="拖曳寵物調整位置" draggable="false"></div><div class="controls"><label>選取素材大小 <output id="sizeValue"></output><input id="size" type="range" min="60" max="300"></label><label>左右位置 <output id="xValue"></output><input id="x" type="range" min="-160" max="160"></label><label>上下位置 <output id="yValue"></output><input id="y" type="range" min="-200" max="80"></label></div><p id="status" role="status"></p><textarea id="json" aria-label="可複製的調整設定" readonly></textarea></main><script>

const $=id=>document.getElementById(id),base=()=>({pet:{size:146,x:120,y:0},staff:{size:142,x:-120,y:0},drink:{size:230,x:0,y:-110}});let settings={kabuki:base(),rira:base(),momo:base()};try{const value=JSON.parse(localStorage.getItem('tt-drink-adjust-v1'));if(value&&Object.keys(settings).every(k=>['pet','staff','drink'].every(p=>['size','x','y'].every(n=>Number.isFinite(value[k]?.[p]?.[n])))))settings=value}catch{}
const nodes={pet:$('pet'),staff:$('actor'),drink:$('drink')};function draw(){const who=$('who').value,part=$('part').value,c=settings[who][part];for(const k of ['size','x','y']){$(k).value=c[k];$(k+'Value').value=c[k]+' px'}for(const [key,node] of Object.entries(nodes)){const v=settings[who][key];node.src=key==='drink'?'../img/pet-drinks-v311/'+({kabuki:'blue',rira:'ghost',momo:'sakura'}[who])+'.png':'../img/companions-v315/'+who+'-'+key+'.gif';node.dataset.selected=key===part;Object.assign(node.style,{width:v.size+'px',height:v.size*(key==='pet'?112/96:1)+'px',left:'calc(50% + '+v.x+'px)',top:(470+v.y)+'px'})}$('json').value=JSON.stringify(settings,null,2)}
$('who').onchange=$('part').onchange=draw;for(const k of ['size','x','y'])$(k).oninput=()=>{settings[$('who').value][$('part').value][k]=Number($(k).value);draw()};let drag;for(const [key,node] of Object.entries(nodes)){node.onpointerdown=e=>{$('part').value=key;draw();drag={...settings[$('who').value][key],startX:e.clientX,startY:e.clientY};node.setPointerCapture(e.pointerId)};node.onpointermove=e=>{if(!drag)return;const c=settings[$('who').value][key];c.x=Math.round(Math.max(-160,Math.min(160,drag.x+e.clientX-drag.startX)));c.y=Math.round(Math.max(-200,Math.min(80,drag.y+e.clientY-drag.startY)));draw()};node.onpointerup=node.onpointercancel=()=>drag=null}
$('reset').onclick=()=>{settings[$('who').value]=base();draw()};$('save').onclick=()=>{try{localStorage.setItem('tt-drink-adjust-v1',JSON.stringify(settings));$('status').textContent='已儲存本機預覽，正式網站尚未套用。'}catch{$('status').textContent='請使用匯出設定。'}};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(settings,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='飲料卡大小與位置.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();
</script></html>
