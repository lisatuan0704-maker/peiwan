<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飲料卡排版調整</title><link rel="stylesheet" href="drink-cards.css?v=330"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#282237;color:#f8e5ef;font:16px system-ui}main{max-width:960px;margin:auto}h1{font-size:25px}p{line-height:1.7;color:#d7bfd8}a{color:#f8d9eb}nav,.controls{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #b79abb;background:#51405f;color:white}label{display:grid;gap:8px}#stage{width:min(100%,420px);margin:auto;transform:none;opacity:1}#stage img{object-fit:contain}#stage .drink-center img{width:100%;height:100%}#stage .drink-friend{image-rendering:pixelated}#stage [data-selected=true]{outline:1px dashed #ffe0f7}#stage .drink-center,#stage .drink-friend{cursor:move;touch-action:none}#stage:after{animation:none;display:none}#json{width:100%;height:130px;background:#1c1927;color:#f8e5ef;padding:12px;border:1px solid #8d6d96}#status{min-height:24px}input{max-width:100%}
#stage #watermark[data-selected=true]{z-index:3;pointer-events:auto;cursor:move;touch-action:none}</style><main><h1>飲料卡 · 個別排版調整</h1><p>蕪是藍白、縭是紫橘、桃是粉黑。這裡與商城使用同一套卡片比例和位置設定，三位分開調整。選素材後可拖位置、拉滑桿改大小；儲存只影響本機預覽，匯出後交給我套用正式站。</p><nav><a href="companion-adjust.html">寵物比例調整</a><select id="who"><option value="kabuki">蕪 · 布布</option><option value="rira">縭 · 鬼鬼</option><option value="momo">桃 · 燈燈</option></select><select id="part"><option value="drink">飲料</option><option value="staff">角色</option><option value="pet">寵物</option><option value="watermark">空心英文名</option></select><button id="reset">重設這張卡</button><button id="save">儲存本機預覽</button><button id="export">匯出設定</button><button id="old" hidden>下載舊版設定備份</button></nav>
<article id="stage" class="drink-slide is-current"><div class="drink-heading"><small>FOR YOU · 一杯小小心意</small><h2 id="name"></h2><div class="drink-unit-price">每杯 99 金幣</div></div><div id="scene" class="drink-scene"><span id="watermark" class="drink-watermark" aria-hidden="true"></span><div id="drink" class="drink-center"><img alt="飲料" draggable="false"></div><img id="actor" class="drink-friend staff" alt="角色" draggable="false"><img id="pet" class="drink-friend pet" alt="寵物" draggable="false"></div></article>
<div class="controls"><label>大小 <output id="sizeValue"></output><input id="size" type="range" min="60" max="440"></label><label>左右位置 <output id="xValue"></output><input id="x" type="range" min="-160" max="160"></label><label>上下位置 <output id="yValue"></output><input id="y" type="range" min="-430" max="80"></label></div><p id="status" role="status"></p><textarea id="json" aria-label="可複製的排版設定" readonly></textarea></main><script src="drink-layout.js?v=330"></script><script src="drink-adjust.js?v=330"></script></html>
