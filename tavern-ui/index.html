/* 名簿精修 v2：柔邊與懸停放大。 */
.cast-row{
  background:var(--pale);
  transform-origin:center;
  transition:transform .2s ease-out,border-color .15s,box-shadow .2s;
}
.cast-row .identity{
  background:linear-gradient(90deg,var(--pale) 65%,transparent 100%);
}
.cast-row .eyes{-webkit-mask:none;mask:none}
@media(hover:hover) and (pointer:fine){
  .cast-row:hover,.cast-row:focus-visible{
    z-index:3;
    transform:scale(1.02);
    box-shadow:0 4px 0 var(--accent),0 0 0 1px #fff;
  }
}
@media(hover:hover) and (pointer:fine) and (max-height:480px){
  .cast-row:hover,.cast-row:focus-visible{transform:scale(1.015)}
}
.motion-off .cast-row:hover,.motion-off .cast-row:focus-visible{transform:none}
@media(prefers-reduced-motion:reduce){
  .cast-row:hover,.cast-row:focus-visible{transform:none}
}
/* 視窗高度由可見舞臺決定，避免矮螢幕被內容撐開。 */
.stage{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}.window{min-height:0;max-height:100%}
/* 動態只留在字緣與姓名區，繪師圖像保持原樣。 */
.title::after{-webkit-text-stroke:1.5px #fff;background:none;mask-image:linear-gradient(110deg,transparent 20%,#000 48%,transparent 77%);mask-size:120px 100%;mask-repeat:no-repeat;mask-position:-150px 0}
@keyframes letter-shine{0%,35%{mask-position:-150px 0}67%,100%{mask-position:360px 0}}
.cast-row::after{inset:auto 55% 9px 20px;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent) -240px 0/120px 100% no-repeat}
.profile-name::after{content:'';width:34px;height:6px;border-top:2px solid var(--accent);border-bottom:1px solid var(--accent);align-self:center;margin-left:auto}
.portrait-corner{display:none}.note-sheet{background:var(--pale);border-left:3px solid var(--accent);box-shadow:none;border-radius:0 8px 8px 0}.note-sheet h3{padding-bottom:7px;border-bottom:1px solid var(--accent)}.note-sheet p{color:#806889}
.cast-row .identity{gap:9px}.cast-name span{color:#6e536f}.mood-line{color:#816781}

<script>
'use strict';
const CAST=[
 {id:'KABUKI',name:'蕪',color:'#88a2c7',pale:'#e8eef8',eye:[70,335,620,230],view:[35,24,677,903],clip:'M 0 0 H 705 V 960 H 0 Z'},
 {id:'MOMO',name:'桃',color:'#d98bad',pale:'#fae8f0',eye:[110,380,690,245],view:[22,15,810,914],clip:'M 0 0 H 794 V 590 L 833 738 V 960 H 0 Z'},
 {id:'RIRA',name:'縭',color:'#aa88c8',pale:'#f0e8f8',eye:[115,360,665,250],view:[18,20,841,914],clip:'M 0 0 H 804 V 464 L 853 642 V 960 H 0 Z'}
];
const $=s=>document.querySelector(s);let active=CAST[0],mode='book',motion=!matchMedia('(prefers-reduced-motion: reduce)').matches,toastTimer;
function artwork(c,eye=false){
  const box=eye?c.eye:c.view,tag=c.id+'-'+eye;
  // 原圖保持不透明，僅沿角色外輪廓裁掉白底，讓人物完整遮住背景文字。
  const silhouette=`<clipPath id="figure-${tag}"><path d="${PORTRAIT_SHAPES[c.id]}"/></clipPath>`;
  return `<svg ${eye?'class="eyes"':''} viewBox="${box.join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${c.id}｜${c.name}的${eye?'雙眼與嘴巴特寫':'角色立繪'}"><defs><clipPath id="clip-${tag}"><path d="${c.clip}"/></clipPath>${silhouette}</defs><g clip-path="url(#clip-${tag})"><g clip-path="url(#figure-${tag})"><image href="assets/${c.id}-original.png" width="1706" height="960"/></g></g></svg>`;
}

$('#roster').innerHTML=CAST.map((c,i)=>`<button class="cast-row" data-cast="${c.id}" style="--accent:${c.color};--pale:${c.pale}" aria-label="認識 ${c.id}｜${c.name}"><span class="cast-watermark" aria-hidden="true">${c.id}</span><div class="identity"><div class="cast-name"><b>${c.name}</b><span>${c.id}</span></div><span class="mood-line">便箋等待更新</span></div>${artwork(c,true)}<span class="row-number">店員 0${i+1}</span><span class="row-arrow" aria-hidden="true">↗</span></button>`).join('');
function show(view,focus=true){document.body.dataset.view=view;$('#rosterWindow').hidden=view!=='roster';$('#profileWindow').hidden=view!=='profile';$('#shopWindow').hidden=view!=='shop';$('#sceneOpen').hidden=view!=='lobby';$('#showRoster').setAttribute('aria-pressed',String(view==='roster'||view==='profile'));$('#showShop').setAttribute('aria-pressed',String(view==='shop'));if(view==='shop'&&!$('#shopFrame').getAttribute('src'))$('#shopFrame').src='時裝間比較.html?v=223';if(focus)requestAnimationFrame(()=>{const target=view==='profile'?$('#tab-intro'):view==='roster'?$('.cast-row'):view==='shop'?$('#shopWindow .close'):$('#sceneOpen');target.focus({preventScroll:true})})}
function tab(id,focus=false){document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===id;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;$('#panel-'+b.dataset.tab).hidden=!on;if(on&&focus)b.focus()})}
function profile(id){active=CAST.find(c=>c.id===id);const w=$('#profileWindow');w.dataset.cast=active.id;w.querySelectorAll('.profile-atmosphere use').forEach(u=>u.setAttribute('href','#motif-'+active.id));w.style.setProperty('--accent',active.color);w.style.setProperty('--pale',active.pale);$('#portrait').innerHTML=artwork(active)+'<span class="portrait-corner" aria-hidden="true"></span><span class="portrait-label"></span>';$('#castName').textContent=active.name;$('#castRoman').textContent=active.id;$('#introLead').textContent='關於'+active.name+'，想讓你知道的事。';$('#moodTitle').textContent=active.name+'的今日便箋';$('#profileWindowTitle').textContent=active.name+'的陪玩資訊';$('#profileWindowTitle').dataset.text=active.name+'的陪玩資訊';$('#pickCast').textContent='選'+active.name+'，一起玩 →';tab('intro');show('profile')}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4300)}
function applyMotion(){document.body.classList.toggle('motion-off',!motion);$('#toggleMotion').setAttribute('aria-pressed',String(motion));$('#motionLabel').textContent='介面動態：'+(motion?'開':'關');$('#shopFrame').contentWindow?.postMessage({type:'tiny-tavern-motion',enabled:motion},location.origin==='null'?'*':location.origin)}
document.querySelectorAll('[data-cast]').forEach(b=>b.onclick=()=>profile(b.dataset.cast));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#rosterHint').textContent=mode==='now'?'草樣未連接上班狀態，先認識三位店員。':'先認識，再決定要和誰一起玩。'});
$('.tabs').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const names=['intro','mood','time'],current=names.indexOf(document.activeElement.dataset.tab);const next=e.key==='Home'?0:e.key==='End'?2:(current+(e.key==='ArrowRight'?1:2))%3;tab(names[next],true)};
$('#backToRoster').onclick=()=>{show('roster',false);$(`[data-cast="${active.id}"]`).focus()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>show('lobby'));$('#sceneOpen').onclick=()=>show('roster');$('#showRoster').onclick=()=>show('roster');$('#showShop').onclick=()=>show('shop');$('#pickCast').onclick=()=>toast('已選擇 '+active.id+'｜'+active.name+'。這是互動草樣，尚未送出訂單。');$('#anyBtn').onclick=()=>toast('這是選擇方式的草樣，尚未進行配對或送出訂單。');$('#toggleMotion').onclick=()=>{motion=!motion;document.body.classList.toggle('motion-user-on',motion);applyMotion()};$('#shopFrame').onload=applyMotion;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.body.dataset.view==='profile')$('#backToRoster').click();else show('lobby')}});applyMotion();
const params=new URLSearchParams(location.search);if(params.get('view')==='profile')profile(params.get('member')||'RIRA');else if(params.get('view')==='shop')show('shop',false);
</script>
