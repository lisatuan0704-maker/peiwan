<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天貼圖調整室｜Tiny Tavern</title><link rel="stylesheet" href="assets/fonts/lineseed.css"><link rel="stylesheet" href="sticker-adjust.css?v=246"></head>
<body><main><header><div><span class="eyebrow">TINY TAVERN / STICKER STUDIO</span><h1>把貼圖放到剛剛好的位置。</h1><p>選一張貼圖，拖曳移動、拉角落縮放。以大廳小人為基準，調好後把數值傳給我。</p></div><span class="stage-tag">獨立預覽・尚未接入聊天</span></header>
<section class="library" aria-label="選擇聊天貼圖"><div class="section-label"><b>你的 10 張貼圖</b><span>每張分開保存，也能一次套用全部。</span></div><div id="gallery"></div></section>
<div class="workspace"><section class="preview"><div class="toolbar"><label>預覽放大 <select id="zoom"><option value="1">100%</option><option value="1.5">150%</option><option value="2" selected>200%</option></select></label><label>貼圖底板 <select id="surface"><option value="white-bubble" selected>白色氣泡</option><option value="transparent">透明底</option></select></label><label><input type="checkbox" id="guides" checked> 顯示輔助線</label><span id="previewState">調整模式・持續顯示</span></div>
<div id="viewport"><div id="scene"><div class="scenery" aria-hidden="true"><img src="../img/lobby-layers-v218/base.png" alt=""><img src="../img/lobby-layers-v218/fixtures.png" alt=""><img src="../img/lobby-layers-v218/stools.png" alt=""><img src="../img/lobby-layers-v218/food.png" alt=""></div><div class="center-guide"></div><div id="actor"><canvas id="doll" width="64" height="64" aria-label="大廳示範角色"></canvas><span class="nameplate">校正用小人</span></div><div id="sticker" role="group" tabindex="0" aria-label="可拖曳的貼圖，方向鍵微調位置"><div id="stickerVisual"><div class="sticker-plate" aria-hidden="true"></div><img id="stickerImage" alt="" draggable="false"></div><button id="resize" aria-label="拖曳等比例縮放貼圖" title="拖曳等比例縮放"></button></div></div></div>
<div class="playback"><button id="play" class="primary">試播一次</button><button id="stop">回到調整</button><span id="timer" role="status">調整時貼圖會一直顯示。</span></div><p class="note">預覽放大只影響觀看；小人與貼圖維持相同比例。白底與小尾巴另外加在原圖下方，原圖與已調好的大小、位置保持不變。</p><p id="sizeInfo" class="note"></p>
</section>
<aside class="controls"><div class="control-title"><div><span class="eyebrow">目前調整</span><h2 id="stickerName">01 吐舌</h2></div><span id="sourceFile"></span></div><div id="fields"></div><div class="actions"><button id="applyAll">此位置與大小套用全部</button><button id="reset">還原這張</button></div><p id="saved" class="note" role="status">設定自動暫存於此瀏覽器。</p>
<div class="export"><h2>調好了，傳給我</h2><p>一次匯出 10 張貼圖的設定。確認後才會加入正式聊天。</p><div class="actions"><button id="copy" class="primary">複製全部數值</button><button id="download">下載設定</button></div><p id="status" role="status"></p><textarea id="output" readonly aria-label="全部貼圖設定" spellcheck="false"></textarea><details><summary>載入之前的數值</summary><textarea id="importText" aria-label="貼上設定" placeholder="貼上整份貼圖設定"></textarea><button id="import">載入設定</button></details></div></aside></div>
</main><script src="sticker-catalog.js?v=245"></script><script src="bubble-doll.js?v=243"></script><script src="sticker-adjust.js?v=246"></script></body></html>
