<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>頭像框校正室｜Tiny Tavern</title>
<link rel="stylesheet" href="assets/fonts/lineseed.css?v=258">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4eef3;color:#4b3d4f;font-family:'Tavern Numerals','TT Latin','TT Huninn','LINE Seed TW',sans-serif;padding:22px}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;color:#8d7690;margin-bottom:16px}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:26px;align-items:start;max-width:1100px}
.stage{position:relative;width:320px;height:320px;margin:0 auto;background:radial-gradient(circle at 50% 38%,#fff 0%,#fdeff7 62%,#f6e1f0 100%);border-radius:22px}
.stage .ava{position:absolute;border-radius:8%;overflow:hidden;outline:2px dashed rgba(200,80,140,.55);outline-offset:-2px}
.stage .ava canvas,.stage .ava img{width:100%;height:100%;display:block;object-fit:cover}
.stage .ava canvas{image-rendering:pixelated}
.stage .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.small{display:flex;gap:18px;justify-content:center;margin-top:16px}
.small .stage{width:132px;height:132px;border-radius:12px}
.small .stage .ava{outline:none}
.small p{font-size:11px;text-align:center;color:#8d7690;margin:6px 0 0}
.panel{background:#fff;border:2px solid #dcc9dd;border-radius:16px;padding:16px 18px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{width:120px;font-size:13px;font-weight:700}
.row input[type=range]{flex:1}
.row output{width:64px;text-align:right;font-size:14px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button,.mode button,.act{border:2px solid #dcc9dd;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:#4b3d4f}
.tabs button.on,.mode button.on{background:#c2537d;border-color:#c2537d;color:#fff}
.mode{display:flex;gap:6px;margin:6px 0 12px}
textarea{width:100%;height:150px;font:12px/1.5 ui-monospace,monospace;border:2px solid #dcc9dd;border-radius:10px;padding:10px;margin-top:10px;color:#4b3d4f}
.hint{font-size:12px;color:#8d7690;line-height:1.7;margin-top:10px}
kbd{background:#f0e6f3;border-radius:4px;padding:1px 5px;font-size:11px}
.act{background:#c2537d;color:#fff;border-color:#c2537d;margin-top:8px}
</style></head><body>
<h1>頭像框校正室</h1>
<div class="sub">拖曳滑桿或用方向鍵微調，讓小人／照片剛好貼合框的開口。調好全部五款後，按「複製參數」把文字貼給 Claude。</div>
<div class="wrap">
<div>
 <div class="stage" id="stage"><div class="ava" id="ava"></div><img class="art" id="art" alt=""></div>
 <div class="small">
  <div><div class="stage" id="s1"></div><p>大廳左上角 HUD 大小</p></div>
  <div><div class="stage" id="s2" style="width:84px;height:84px"></div><p>頭像框選單縮圖大小</p></div>
 </div>
</div>
<div class="panel">
 <div class="tabs" id="tabs"></div>
 <div class="mode" id="mode"><button data-m="doll" class="on">像素小人</button><button data-m="pic">上傳的照片</button></div>
 <div class="row"><label>水平位置 x</label><input type="range" id="x" min="30" max="70" step="0.1"><output id="xo"></output></div>
 <div class="row"><label>垂直位置 y</label><input type="range" id="y" min="30" max="70" step="0.1"><output id="yo"></output></div>
 <div class="row"><label>大小 d</label><input type="range" id="d" min="40" max="120" step="0.1"><output id="do"></output></div>
 <div class="hint">鍵盤：<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 移動 0.5、<kbd>+</kbd><kbd>-</kbd> 縮放 0.5，按住 <kbd>Shift</kbd> 變 2。虛線是頭像方塊的邊界（小人四邊有透明留白，通常要比照片大一點、低一點）。</div>
 <button class="act" id="copy">複製參數</button>
 <textarea id="out" readonly></textarea>
 <div class="hint">設定會暫存在這個瀏覽器，重新開啟頁面不會不見。</div>
</div>
</div>

const PIC='assets/avatar-MOMO.png?v=260';
const NAMES={vip1:'VIP1 藍調樂手框',vip2:'VIP2 酒館饗宴框',vip3:'VIP3 薔薇緞帶框',vip4:'VIP4 星夜魔法框',vip5:'VIP5 甜心派對框'};
const DEF={"vip1": {"pic": {"x": 50.2, "y": 51.3, "d": 77}, "doll": {"x": 50.7, "y": 49.6, "d": 74.8}}, "vip2": {"pic": {"x": 50.2, "y": 51.3, "d": 79.9}, "doll": {"x": 53.1, "y": 51.2, "d": 77}}, "vip3": {"pic": {"x": 50.15, "y": 56.45, "d": 74.3}, "doll": {"x": 51.4, "y": 54.9, "d": 73.4}}, "vip4": {"pic": {"x": 50.15, "y": 53.4, "d": 77.2}, "doll": {"x": 52, "y": 52.9, "d": 76.6}}, "vip5": {"pic": {"x": 50.2, "y": 51.3, "d": 79.9}, "doll": {"x": 50.9, "y": 51.6, "d": 75.7}}};
let S;try{S=JSON.parse(localStorage.getItem('tt_frame_adjust')||'null');}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(DEF));
let cur='vip1',mode='doll';
const $=s=>document.querySelector(s);
const tabs=$('#tabs');Object.keys(NAMES).forEach(k=>{const b=document.createElement('button');b.textContent=NAMES[k];b.dataset.k=k;b.onclick=()=>{cur=k;render();};tabs.append(b);});
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});
function fill(host,box,big){host.innerHTML='';const a=document.createElement('div');a.className='ava';a.style.width=box.d+'%';a.style.height=box.d+'%';a.style.left=(box.x-box.d/2)+'%';a.style.top=(box.y-box.d/2)+'%';
 if(mode==='pic'){const i=document.createElement('img');i.src=PIC;a.append(i);}else{const c=document.createElement('canvas');c.width=64;c.height=64;const im=new Image();im.onload=()=>c.getContext('2d').drawImage(im,0,0);im.src=DOLL;a.append(c);}
 host.append(a);const art=document.createElement('img');art.className='art';art.src='../img/frames/'+cur+'.webp';host.append(art);}
function render(){
 const box=S[cur][mode];
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
 fill($('#stage'),box);fill($('#s1'),box);fill($('#s2'),box);
 $('#x').value=box.x;$('#y').value=box.y;$('#d').value=box.d;$('#xo').value=box.x+'%';$('#yo').value=box.y+'%';$('#do').value=box.d+'%';
 $('#out').value=JSON.stringify(S,null,1).replace(/\n\s*/g,' ').replace(/\{ /g,'{').replace(/ \}/g,'}');
 try{localStorage.setItem('tt_frame_adjust',JSON.stringify(S));}catch(e){}
}
['x','y','d'].forEach(k=>$('#'+k).oninput=()=>{S[cur][mode][k]=+(+$('#'+k).value).toFixed(1);render();});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const st=e.shiftKey?2:0.5;const b=S[cur][mode];let h=true;
 if(e.key==='ArrowLeft')b.x-=st;else if(e.key==='ArrowRight')b.x+=st;else if(e.key==='ArrowUp')b.y-=st;else if(e.key==='ArrowDown')b.y+=st;
 else if(e.key==='+'||e.key==='=')b.d+=st;else if(e.key==='-')b.d-=st;else h=false;
 if(h){e.preventDefault();['x','y','d'].forEach(k=>b[k]=+b[k].toFixed(1));render();}});
$('#copy').onclick=()=>{const t=$('#out');t.select();try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand('copy');}$('#copy').textContent='已複製，貼給 Claude 就好';setTimeout(()=>$('#copy').textContent='複製參數',1800);};
render();
