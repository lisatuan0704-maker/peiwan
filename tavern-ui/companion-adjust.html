<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小人與寵物比例調整</title><style>
*{box-sizing:border-box}body{margin:0;background:#282237;color:#f8e5ef;font:16px system-ui;padding:24px}main{max-width:960px;margin:auto}h1{font-size:25px}button,select,input{font:inherit}button,select{padding:10px;border-radius:9px;border:1px solid #b79abb;background:#51405f;color:white}nav,.controls{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:8px}#stage{position:relative;width:100%;height:430px;background:repeating-linear-gradient(0deg,#675044 0 49px,#8d6954 50px 52px);border:2px solid #b79abb;border-radius:18px;overflow:hidden}#stage:after{content:'地板基準線';position:absolute;left:0;right:0;top:330px;border-top:1px dashed #efd7c6;color:#efd7c6;font-size:12px;pointer-events:none}#actor{position:absolute;left:calc(50% - 80px);top:170px;width:160px;height:160px;object-fit:contain;image-rendering:pixelated}#pet{position:absolute;object-fit:contain;image-rendering:pixelated;touch-action:none;cursor:move;transform:translate(-50%,-100%)}p{line-height:1.7;color:#d7bfd8}output{font-variant-numeric:tabular-nums}textarea{width:100%;height:120px;background:#1c1927;color:#f8e5ef;border:1px solid #8d6d96;padding:12px}#status{min-height:28px}</style><main><h1>小人與寵物 · 比例調整</h1><p>拖曳寵物改位置，拉動滑桿改大小。中央小人固定為 160 × 160，方便比較。設定只存在這台瀏覽器；按「匯出設定」下載後交給我套用到正式網站。</p><nav><a href="drink-adjust.html" style="color:#f8e5ef">飲料卡位置調整 →</a><select id="who"><option value="kabuki">蕪 · 布布</option><option value="rira">縭 · 鬼鬼</option><option value="momo">桃 · 燈燈</option></select><button id="reset">重設這隻</button><button id="save">儲存本機預覽</button><button id="export">匯出設定</button></nav><div id="stage"><img id="actor" alt="角色比例參照" draggable="false"><img id="pet" alt="拖曳寵物調整位置" draggable="false"></div><div class="controls"><label>寵物大小 <output id="sizeValue"></output><input id="size" type="range" min="60" max="300"></label><label>左右位置 <output id="xValue"></output><input id="x" type="range" min="-260" max="260"></label><label>上下位置 <output id="yValue"></output><input id="y" type="range" min="-200" max="80"></label></div><p id="status" role="status"></p><textarea id="json" aria-label="可複製的調整設定" readonly></textarea></main><script>
const $=id=>document.getElementById(id),defaults=()=>({size:160,x:130,y:0});let settings={kabuki:defaults(),rira:defaults(),momo:defaults()};try{const saved=JSON.parse(localStorage.getItem('tt-companion-adjust-v1'));for(const k of Object.keys(settings))if(saved?.[k]&&['size','x','y'].every(n=>Number.isFinite(saved[k][n])))settings[k]=saved[k]}catch{}
function draw(){const c=settings[$('who').value];$('actor').src='../img/companions-v315/'+$('who').value+'-staff.gif';$('pet').src='../img/companions-v315/'+$('who').value+'-pet.gif';for(const k of ['size','x','y']){$(k).value=c[k];$(k+'Value').value=c[k]+' px'}Object.assign($('pet').style,{width:c.size+'px',height:c.size*112/96+'px',left:'calc(50% + '+c.x+'px)',top:(330+c.y)+'px'});$('json').value=JSON.stringify(settings,null,2)}
$('who').onchange=draw;for(const k of ['size','x','y'])$(k).oninput=()=>{settings[$('who').value][k]=Number($(k).value);draw()};let drag;$('pet').onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,...settings[$('who').value],startX:e.clientX,startY:e.clientY};$('pet').setPointerCapture(e.pointerId)};$('pet').onpointermove=e=>{if(!drag)return;const c=settings[$('who').value];c.x=Math.round(Math.max(-260,Math.min(260,drag.x+e.clientX-drag.startX)));c.y=Math.round(Math.max(-200,Math.min(80,drag.y+e.clientY-drag.startY)));draw()};$('pet').onpointerup=$('pet').onpointercancel=()=>drag=null;
$('reset').onclick=()=>{settings[$('who').value]=defaults();draw()};$('save').onclick=()=>{try{localStorage.setItem('tt-companion-adjust-v1',JSON.stringify(settings));$('status').textContent='已儲存在這台瀏覽器，正式網站尚未套用。'}catch{$('status').textContent='瀏覽器無法儲存，請匯出設定。'}};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(settings,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='寵物大小與位置.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();
</script></html>
