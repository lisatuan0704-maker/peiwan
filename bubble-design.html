<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>對話框配色工作台｜小小酒館</title><link rel="stylesheet" href="tavern-ui/assets/fonts/lineseed.css"><link rel="stylesheet" href="lobby-ui/bubble-skins-preview.css?v=365"><link rel="stylesheet" href="lobby-ui/bubble-design.css?v=365"></head>
<body class="design-studio">
<header><div><p class="eyebrow">TINY TAVERN · LITTLE CONVERSATIONS</p><h1>對話框配色工作台</h1><p>挑顏色、轉方向，再把設定複製給我。</p></div><span class="preview-badge">對話框樣式預覽</span></header>
<main>
<section class="stage-panel" aria-label="酒館實景預覽">
 <div class="stage-top"><div><span class="dot"></span>酒館裡的樣子</div><div class="stage-tools"><button id="effects" aria-pressed="true">邊框流光：開</button><button id="copyDesignQuick">複製設定</button></div></div>
 <div class="stage" id="stage"><div class="scene-shade"></div><div class="speaker"><div class="bubble cream" id="mainBubble"><span class="message">大家好！</span></div><canvas class="character" id="character" aria-label="酒館預覽角色"></canvas><span class="nameplate">小小闆闆</span></div><span class="stage-caption">字體大小一致 · 氣泡依文字自然延伸</span></div>
 <div class="composer"><label for="message">試著聊一句</label><div class="input-row"><input id="message" value="大家好！" autocomplete="off"><span id="count">2 / 18</span></div><div class="samples"><button data-text="安安">安安</button><button data-text="今天也一起玩吧！">日常招呼</button><button data-text="今天很開心認識大家下次再一起打遊戲好">18 字長句</button><button data-text="Hello 👋 一起玩嗎？">中英與表情</button></div></div>
</section>
<aside class="editor-panel"><p class="eyebrow">YOUR BUBBLE PALETTE</p><h2>調成你喜歡的樣子</h2>
<label class="field-label" for="designSkin">選擇款式</label><select id="designSkin"></select>
<div class="target-tabs" role="group" aria-label="調整部位"><button type="button" data-target="fill" aria-pressed="true">氣泡底色</button><button type="button" data-target="border" aria-pressed="false">邊框漸層</button></div>
<div class="gradient-strip" id="gradientStrip" aria-label="目前漸層"></div>
<div class="color-count"><label><input type="radio" name="colorCount" value="2" checked>雙色</label><label><input type="radio" name="colorCount" value="3">三色</label></div>
<div id="colorFields"></div>
<div class="direction-head"><label for="angleNumber">漸層方向</label><div><input id="angleNumber" type="number" min="0" max="359" value="130" aria-label="漸層角度">°</div></div><input id="angleRange" type="range" min="0" max="359" value="130" aria-label="拖曳漸層方向">
<div class="directions" role="group" aria-label="方向快捷選擇"><button data-angle="90">向右 →</button><button data-angle="180">向下 ↓</button><button data-angle="270">向左 ←</button><button data-angle="0">向上 ↑</button><button data-angle="135">右下 ↘</button><button data-angle="225">左下 ↙</button><button data-angle="45">右上 ↗</button><button data-angle="315">左上 ↖</button></div><p class="hint">第一個顏色沿箭頭方向，漸變成最後一個顏色。</p>
<div id="fillExtras"><label class="setting-row" for="fillOpacity">底色不透明度 <span><output id="opacityLabel">100</output>%</span></label><input type="range" id="fillOpacity" min="40" max="100" value="100"><label class="check-row"><input type="checkbox" id="softLight" checked>保留柔光層次</label></div>
<label class="setting-row" for="textColor">文字顏色 <input id="textColor" type="color" value="#70535e"></label><p class="hint" id="readability" role="status"></p>
<label class="field-label" for="designNote">想補充的設計想法</label><textarea id="designNote" rows="2" placeholder="例如：希望小貓再靠右一點、花邊再細一點…"></textarea>
<div class="design-actions"><button class="copy-main" id="copyDesign">複製設計設定</button><button id="downloadDesign">下載備份</button><button id="resetDesign">還原這款配色</button></div>
<p id="designStatus" role="status">每款分開自動暫存，只存在這個瀏覽器。</p>
<details class="transfer"><summary>查看／貼上設定</summary><p class="hint">複製後直接貼到聊天裡。也能把之前的設定貼回來繼續調。</p><textarea id="designJson" rows="8" aria-label="設計設定文字"></textarea><button id="importDesign">套用貼上的設定</button><label class="file-button">匯入備份檔<input type="file" id="importDesignFile" accept=".json,application/json"></label></details>
<div hidden><div id="skinList"></div><div id="basicSkinList"></div><strong id="selectedName"></strong><p id="selectedDescription"></p></div>
</aside>
<section class="comparison"><div class="section-title"><div><p class="eyebrow">SIDE BY SIDE</p><h2>同一句話，九種心情。</h2></div><p>跟著上方輸入一起更新</p></div><div id="comparisonGrid"></div></section>
</main><canvas id="doll" width="64" height="64" hidden></canvas>
<script src="tavern-ui/bubble-doll.js?v=362"></script><script src="lobby-ui/bubble-skins-preview.js?v=365"></script><script src="lobby-ui/bubble-design.js?v=365"></script></body></html>
