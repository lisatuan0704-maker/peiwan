<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>酒館大廳｜Tiny Tavern 小小酒館</title><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=470">
<link rel="canonical" href="https://tinytavern.tw/lobby.html">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#352631}#tavernView{position:fixed;left:0;top:0;border:0;transform-origin:0 0}
</style></head>
<body><iframe id="tavernView" title="小小酒館大廳" allow="microphone; autoplay; fullscreen" allowfullscreen></iframe>
<script>
/* v555 介面整體縮小（D 11/18：「整體都很大」）：照 1280×720 設計，螢幕比這大時不再整個等比放大，
   多出來的放大只給七成（1920×1080：1.5→1.35 倍，約小一成；2560×1440：2→1.7；1366×768 幾乎不變），筆電的小字照樣看得清楚。 */
(()=>{'use strict';if(!new URLSearchParams(location.search).has('preview')&&!matchMedia('(hover: hover) and (pointer: fine)').matches){location.replace('lobby.html'+location.search+location.hash);return;}const frame=document.getElementById('tavernView');const fit=()=>{const s0=Math.min(innerWidth/1280,innerHeight/720),scale=s0>1?1+(s0-1)*.7:s0;frame.style.width=innerWidth/scale+'px';frame.style.height=innerHeight/scale+'px';frame.style.transform='scale('+scale+')';};fit();addEventListener('resize',fit);const source=new URL('lobby.html',location.href);source.search=location.search;source.hash=location.hash;source.searchParams.set('v','572');frame.src=source.href;})();
</script></body></html>
