<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天氣泡調整｜小小酒館</title><link rel="stylesheet" href="tavern-ui/assets/fonts/lineseed.css"><link rel="stylesheet" href="lobby-ui/chat-adjust.css?v=360"></head>
<body><header><div><span>TINY TAVERN / CHAT STUDIO</span><h1>聊天氣泡調整</h1><p>一款一款調整，看到喜歡的比例再決定。</p></div><a href="lobby.html?v=359">返回大廳 ↗</a></header>
<main><section class="preview"><div class="toolbar"><label>預覽樣式 <select id="frame"><option value="none">無框文字</option><option value="12" selected>餅乾框</option><option value="11">泡泡框</option><option value="14">夢落星間</option><option value="10">花框</option><option value="13">俏皮花貓框</option></select></label><label><input id="guides" type="checkbox">顯示文字範圍</label></div>
<div id="viewport"><div id="scene"><div id="bubble" tabindex="0" aria-label="氣泡位置，可拖曳或使用方向鍵微調"><canvas id="frameCanvas"></canvas><div id="textBox"><span id="bubbleText"></span></div></div><div id="actor"><canvas id="doll" width="64" height="64" aria-label="預覽角色"></canvas><span>預覽角色</span></div></div></div>
<p id="scaleInfo"></p><label for="sampleText">試著聊一句</label><textarea id="sampleText" rows="2">今天也一起玩吧！</textarea><div class="samples"><button data-text="安安">短句</button><button data-text="今天也一起玩吧！">8 字</button><button data-text="今天很開心認識大家下次再一起打遊戲好">18 字</button><button data-text="Hello 👋 今天一起玩嗎？">中英與表情</button></div><p id="warning" role="status"></p>
<div class="savebar"><strong>調整會自動暫存</strong><p>六款各自保存。下載設定後傳給我，就能照這份設定套回大廳。</p><button id="download" class="primary">下載全部設定</button><button id="copy">複製設定</button><button id="importButton">匯入設定</button><input id="importFile" type="file" accept="application/json,.json" hidden><details><summary>顯示設定文字</summary><textarea id="configText" readonly aria-label="全部設定文字" rows="4"></textarea></details><p id="status" aria-live="polite">此頁只預覽，不會傳送聊天或更改正式大廳。</p></div></section>
<aside><h2 id="frameName">餅乾框</h2><p>框的裝飾先保持原圖比例；字體與位置可以分開調。</p><fieldset id="controls" disabled><h3>文字</h3><div id="textControls"></div><label class="check">文字顏色 <input id="textColor" type="color" value="#3a2c3a"></label><label class="check"><input id="bold" type="checkbox" checked>粗體</label><h3>框與角色的距離</h3><div id="positionControls"></div><h3>框的大小</h3><label class="check"><input id="lockRatio" type="checkbox" checked>鎖定原圖比例</label><div id="frameControls"></div><h3>框內文字範圍</h3><div id="areaControls"></div><button id="reset">還原這一款</button></fieldset></aside></main>
<script src="tavern-ui/bubble-doll.js?v=243"></script><script src="lobby-ui/chat-adjust.js?v=360"></script></body></html>
