<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>冒險者頭貼裁切調整</title>
<link rel="stylesheet" href="tavern-ui/assets/fonts/lineseed.css">
<link rel="stylesheet" href="lobby-ui/avatar-crop.css?v=415">
<style>
:root{--ink:#1C2156;--pink:#FF4F8B;--pink2:#FF9EC4;--mute:#6A7199;--line:#CFEFFF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#C9D6FA,#DCCFF6 55%,#F3D9EC);color:var(--ink);font-family:"LINE Seed TW","LINE Seed JP",system-ui,sans-serif;padding:24px 16px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{background:linear-gradient(100deg,#fff,#EEF7FF 60%,#F5EFFF);border:3px solid var(--ink);border-radius:18px;padding:16px 20px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--line),8px 8px 0 -1px #FFD6E6,8px 8px 0 2px var(--ink)}
.head small{color:var(--pink);font-weight:900;letter-spacing:2.5px;font-size:11px}
.head h1{display:table;margin:6px 0 8px;padding:5px 22px 6px 14px;background:linear-gradient(180deg,#fff,#FFF0F6);border:3px solid var(--ink);border-radius:4px;transform:skewX(-8deg);box-shadow:4px 5px 0 var(--pink2);font-size:21px}
.head p{margin:0;font-weight:700;color:var(--mute);font-size:13.5px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(170deg,#fff,#F6FAFF 60%,#F8F3FF);border:3px solid var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--line),6px 6px 0 var(--ink)}
.card h2{margin:0;font-size:20px;display:flex;align-items:baseline;gap:8px}.card h2 small{font-size:12px;color:var(--mute);letter-spacing:1px}
.stage{position:relative;width:100%;max-width:300px;aspect-ratio:1;margin:0 auto;touch-action:none;cursor:grab;user-select:none}
.stage:active{cursor:grabbing}
.stage .ghost,.stage .ring img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;pointer-events:none}
.stage .ghost{opacity:.28;filter:grayscale(.3)}
.stage .ring{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 4px var(--ink),0 0 0 7px #FFD6E6}
.stage .cross{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff6,#fff6) 50% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 0 50%/100% 1px no-repeat}
.ctl{display:grid;grid-template-columns:56px minmax(0,1fr) 64px;gap:8px;align-items:center;font-weight:800;font-size:13px}
.ctl input[type=range]{width:100%;accent-color:var(--pink)}
.ctl output{font-variant-numeric:tabular-nums;text-align:right;color:var(--mute)}
.prev{display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap;padding:10px;border:2px dashed #C3CBEE;border-radius:14px;background:#fff}
.prev figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--mute)}
.mini{position:relative;border-radius:50%;overflow:hidden;background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 2px #FFD6E6}
.mini img{width:100%;height:100%;display:block;object-fit:cover;transform-origin:50% 50%}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{min-height:40px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:900;font-size:14px;padding:0 14px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
button.primary{background:linear-gradient(180deg,#FF8DB5,#FF4F8B 60%,#F03C7C);color:#fff;box-shadow:0 4px 0 var(--ink),inset 0 2px 0 #ffffff80}
.out{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:6px 6px 0 var(--ink)}
.out textarea{width:100%;min-height:96px;border:2px solid #C3CBEE;border-radius:12px;padding:10px;font:12.5px/1.6 ui-monospace,Consolas,monospace;color:var(--ink);resize:vertical}
.msg{font-weight:800;font-size:13px;color:#16A05A;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <small>ADVENTURER AVATAR · CROP</small>
    <h1>冒險者頭貼裁切調整</h1>
    <p>在大圓圈上拖曳移動、滾輪或滑桿縮放，淡色部分是會被裁掉的地方。下方小圖是私訊標題、通訊錄名單、手機通訊錄的實際大小。調好後按「複製設定」貼給 Claude 寫回網站。這頁只存在你的瀏覽器，不會改到網站。</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="out">
    <div class="row"><button class="primary" id="copy">複製設定</button><button id="resetAll">三位都回到網站目前的設定</button></div>
    <textarea id="json" readonly aria-label="裁切設定"></textarea>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
(()=>{'use strict';
const LIST=[['MOMO','桃'],['KABUKI','蕪'],['RIRA','縭']];
const KEY='tt_avatar_crop_adjust_v415';
const SIZES=[[58,'私訊標題'],[56,'通訊錄名單'],[56,'手機通訊錄'],[120,'放大檢查']];
const src=t=>'tavern-ui/assets/avatar-'+t+'.png?v=260';
const round=(n,d)=>Math.round(n*10**d)/10**d;
function siteValue(t){const im=document.createElement('img');im.src='data:,';im.setAttribute('src',src(t));im.style.display='none';document.body.append(im);const cs=getComputedStyle(im);
  const v={z:parseFloat(cs.getPropertyValue('--ac-z'))||1.14,x:parseFloat(cs.getPropertyValue('--ac-x'))||0,y:parseFloat(cs.getPropertyValue('--ac-y'))||0};im.remove();return v;}
const SITE={};LIST.forEach(([t])=>SITE[t]=siteValue(t));
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){state={};}
LIST.forEach(([t])=>{const v=state[t];if(!v||!isFinite(v.z)||!isFinite(v.x)||!isFinite(v.y))state[t]={...SITE[t]};});
const tf=v=>'translate('+v.x+'%,'+v.y+'%) scale('+v.z+')';
const grid=document.getElementById('grid'),views={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  const out={format:'tiny-tavern-avatar-crop',version:1};LIST.forEach(([t])=>out[t]={z:round(state[t].z,3),x:round(state[t].x,2),y:round(state[t].y,2)});
  document.getElementById('json').value=JSON.stringify(out);}
function paint(t){const v=state[t],w=views[t];w.imgs.forEach(im=>im.style.transform=tf(v));
  w.z.value=v.z;w.x.value=v.x;w.y.value=v.y;w.zo.value=v.z.toFixed(2)+'×';w.xo.value=v.x.toFixed(1)+'%';w.yo.value=v.y.toFixed(1)+'%';}
function clamp(v){v.z=Math.min(3,Math.max(.8,v.z));v.x=Math.min(60,Math.max(-60,v.x));v.y=Math.min(60,Math.max(-60,v.y));}
LIST.forEach(([t,name])=>{
  const c=document.createElement('section');c.className='card';
  c.innerHTML='<h2>'+name+' <small>'+t+'</small></h2><div class="stage"><img class="ghost" alt=""><div class="ring"><img alt="'+name+'"></div><div class="cross"></div></div>'
   +'<label class="ctl">放大<input type="range" min="0.8" max="3" step="0.01" data-k="z"><output></output></label>'
   +'<label class="ctl">左右<input type="range" min="-60" max="60" step="0.5" data-k="x"><output></output></label>'
   +'<label class="ctl">上下<input type="range" min="-60" max="60" step="0.5" data-k="y"><output></output></label>'
   +'<div class="prev"></div><div class="row"><button data-act="site">回到網站目前的設定</button><button data-act="full">整張不放大</button></div>';
  grid.append(c);
  const prev=c.querySelector('.prev');SIZES.forEach(([s,lb])=>{const f=document.createElement('figure');f.innerHTML='<span class="mini" style="width:'+s+'px;height:'+s+'px"><img alt=""></span><figcaption>'+lb+'</figcaption>';prev.append(f);});
  const imgs=[...c.querySelectorAll('img')];imgs.forEach(im=>im.src=src(t));
  const [z,x,y]=['z','x','y'].map(k=>c.querySelector('input[data-k="'+k+'"]'));const outs=c.querySelectorAll('output');
  views[t]={imgs,z,x,y,zo:outs[0],xo:outs[1],yo:outs[2]};
  [z,x,y].forEach(inp=>inp.oninput=()=>{state[t][inp.dataset.k]=parseFloat(inp.value);clamp(state[t]);paint(t);save();});
  c.querySelector('[data-act="site"]').onclick=()=>{state[t]={...SITE[t]};paint(t);save();};
  c.querySelector('[data-act="full"]').onclick=()=>{state[t]={z:1,x:0,y:0};paint(t);save();};
  const stage=c.querySelector('.stage');let drag=null;
  stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,x:state[t].x,y:state[t].y};});
  stage.addEventListener('pointermove',e=>{if(!drag)return;const W=stage.clientWidth;state[t].x=drag.x+(e.clientX-drag.px)/W*100;state[t].y=drag.y+(e.clientY-drag.py)/W*100;clamp(state[t]);paint(t);});
  const end=()=>{if(drag){drag=null;save();}};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  stage.addEventListener('wheel',e=>{e.preventDefault();state[t].z*=e.deltaY<0?1.03:1/1.03;clamp(state[t]);paint(t);save();},{passive:false});
  paint(t);
});
document.getElementById('resetAll').onclick=()=>{LIST.forEach(([t])=>{state[t]={...SITE[t]};paint(t);});save();};
document.getElementById('copy').onclick=async()=>{const ta=document.getElementById('json');const m=document.getElementById('msg');
  try{await navigator.clipboard.writeText(ta.value);m.textContent='已複製，貼給 Claude 就可以寫回網站。';}catch(e){ta.select();m.textContent='請按 Ctrl+C 複製上面的文字。';}};
save();
})();
</script>
</body>
</html>
