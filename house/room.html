<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>小小酒館・我的小屋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：像遊戲畫面——上方工具列，中間是房間，右側（窄螢幕在下方）是家具清單 */
:root{
  --bg:#f6e4e0; --panel:#fff7f4; --ink:#532722; --ink-soft:#8a5a52; --line:#e3b9b0;
  --accent:#d9647c; --accent-ink:#fff; --ok:#5e9c58; --bad:#c8415b; --chip:#fbe3e3;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a1a1c; --panel:#3a2427; --ink:#f8e4e0; --ink-soft:#d4aaa4; --line:#5e3a3c;
  --accent:#ee8494; --accent-ink:#2a1a1c; --ok:#8fc884; --bad:#ff8a9c; --chip:#4a2e32; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1a1c; --panel:#3a2427; --ink:#f8e4e0; --ink-soft:#d4aaa4; --line:#5e3a3c;
  --accent:#ee8494; --accent-ink:#2a1a1c; --ok:#8fc884; --bad:#ff8a9c; --chip:#4a2e32; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:10px;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
h1{font-size:20px;margin:0;letter-spacing:.04em;text-wrap:balance}
.modes{display:flex;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:3px}
.modes button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:9px;padding:6px 14px;background:transparent;color:var(--ink-soft);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modes.themes{flex-wrap:wrap;max-width:100%}   /* 20 個主題：換行排，不擠成直排字 */
.modes.themes button{white-space:nowrap;padding:6px 11px}
.hint{font-size:13px;color:var(--ink-soft);flex:1;min-width:200px}
.main{display:flex;gap:12px;flex:1;min-height:0}
.stage.night{background:#1c1218;border-color:#4a2a30}
.stage{flex:1;min-width:0;min-height:420px;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;position:relative;cursor:grab}
.stage canvas{position:absolute;inset:0}
.cam{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.cam button{font:inherit;font-weight:700;font-size:14px;min-width:36px;height:32px;border-radius:9px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.cam button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.size{position:absolute;left:12px;bottom:8px;margin:0;font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:2px 10px}
.exp{font-size:12px;color:var(--ink-soft);margin:0 0 6px;line-height:1.6}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
.side{width:230px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.side[hidden]{display:none!important}
.box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px}
.box h2{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);margin:0 0 8px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--chip);border:2px solid transparent;border-radius:10px;padding:6px 2px;cursor:pointer;font:inherit;font-size:12px;color:var(--ink)}
.item:hover,.item:focus-visible{border-color:var(--accent);outline:none}
.item canvas{width:44px;height:44px}
.item small{font-size:10px;color:var(--ink-soft)}
.grp{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.08em;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools button{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:5px 10px;cursor:pointer}
.tools button:disabled{opacity:.4;cursor:default}
.tools button:focus-visible,.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.keys{font-size:12px;color:var(--ink-soft);line-height:1.7;margin:0;padding-left:16px}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--chip)}
@media (max-width:760px){.main{flex-direction:column}.side{width:auto}.items{grid-template-columns:repeat(4,1fr)}}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="../tavern-ui/assets/fonts/lineseed.css">
<style id="house-css">
/* 小屋（大廳版）：房間畫布鋪滿整個 iframe，原本小屋頁的標題列、右側清單、縮放鈕都收起來（大廳那邊有自己的按鈕）。
   按鈕、提示用大廳同一套：白紙、深藍框、粉色主按鈕、LINE Seed 字。 */
:root{--ink:#1C2156;--pink:#FF4F8B;--paper:#fffdf8;--line:#1C2156;color-scheme:light}
html,body{height:100%;margin:0;padding:0!important;overflow:hidden}
/* v495 D：背景先用純漸層（原本的像素晚霞天空拿掉） */
html,body{background:linear-gradient(180deg,#2f2350 0%,#5b3a72 42%,#a8648a 74%,#e9a596 100%) fixed!important}
body{font-family:'LINE Seed TW','TT Huninn','Microsoft JhengHei',system-ui,sans-serif!important}
.app{max-width:none!important;height:100%!important;margin:0!important;gap:0!important;display:block!important}
.app>header,#side,.cam,.size{display:none!important}
.main{display:block!important;height:100%}
.stage,.stage.night{position:fixed!important;inset:0;min-height:0!important;border:0!important;border-radius:0!important;background:transparent!important;cursor:default}
#hsSky{position:fixed;left:0;top:0;z-index:-1;image-rendering:pixelated;pointer-events:none}
#hint{display:none!important}

/* 拿起家具時，家具旁邊的小按鈕列 */
#hsHold{position:fixed;z-index:20;display:flex;gap:6px;padding:6px;background:var(--paper);border:2px solid var(--line);border-radius:14px;
  box-shadow:4px 4px 0 #FFB6CF,0 6px 18px #1c215633;transform:translate(-50%,-100%)}
#hsHold[hidden]{display:none}
#hsHold button{font:inherit;font-size:14px;font-weight:700;line-height:1;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
#hsHold button:hover{background:#FFF0F6}
#hsHold button.ok{background:var(--pink);color:#fff}
#hsHold button.ok:hover{background:#ff6b9d}
#hsHold button:disabled{opacity:.4;cursor:default}
#hsHold button:focus-visible{outline:3px solid #8FD3FF;outline-offset:1px}

/* 提示：畫面下方中間的小白卡，幾秒後自己收起來 */
#hsTip{position:fixed;left:50%;bottom:var(--tip-b,120px);z-index:21;transform:translate(-50%,8px);max-width:min(520px,calc(100vw - 32px));
  padding:9px 16px;border:2px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;
  box-shadow:3px 3px 0 #FFB6CF;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#hsTip.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#hsTip{transition:none}}

</style>

<div class="app">
  <header>
    <h1>小小酒館・我的小屋</h1>
    <div class="modes" role="group" aria-label="模式">
      <button id="mWalk" aria-pressed="true">散步</button>
      <button id="mEdit" aria-pressed="false">佈置</button>
    </div>
    <div class="modes themes" role="group" aria-label="房間主題">
      <span id="themeBtns" style="display:contents"></span>
    </div>
    <div class="modes" role="group" aria-label="像素版本">
      <button id="v5" aria-pressed="false">像素 v5</button>
      <button id="v6" aria-pressed="true">像素 v7</button>
    </div>
    <p class="hint" id="hint">點地板，中華小惡魔會繞過家具走過去。</p>
  </header>
  <div class="main">
    <div class="stage" id="stage"><canvas id="cv" width="420" height="380" aria-label="小屋畫面"></canvas>
      <div class="cam" role="group" aria-label="視角"><button id="zIn" aria-label="放大">＋</button><button id="zOut" aria-label="縮小">－</button><button id="zFit">整間</button></div>
      <p class="size" id="sizeTag"></p></div>
    <aside class="side" id="side" hidden>
      <div class="box"><h2>房間大小</h2><p class="exp" id="expInfo"></p><div class="tools"><button id="bExpand">擴建</button></div></div>
      <div class="box"><h2>地板家具</h2><div class="items" id="floorItems"></div></div>
      <div class="box"><h2>牆面裝飾</h2><div class="items" id="wallItems"></div></div>
      <div class="box"><h2>小物</h2><p class="exp">拿到桌子、櫃子上會自動擺到桌面（黃框），其他地方就放地板。</p><div class="items" id="decoItems"></div></div>
      <div class="box"><h2>拿在手上時</h2>
        <div class="tools">
          <button id="bRot" disabled>轉向</button>
          <button id="bDel" disabled>收回</button>
          <button id="bCancel" disabled>取消</button>
          <button id="bReset">恢復預設擺設</button>
        </div>
        <ul class="keys">
          <li>點房間裡的家具＝拿起來移動</li>
          <li><kbd>V</kbd> 切換 v5／v7　<kbd>R</kbd> 轉向　<kbd>Del</kbd> 收回　<kbd>Esc</kbd> 取消</li>
          <li>綠色＝可以放，紅色＝重疊或超出房間</li>
        </ul>
      </div>
    </aside>
  </div>
</div>

<!-- 小屋（大廳版）介面骨架：天空畫布、拿起家具時的小按鈕列、提示。其他按鈕（佈置、家具店、縮放、回大廳）在大廳那邊 -->
<canvas id="hsSky" aria-hidden="true"></canvas>
<div id="hsHold" hidden>
  <button type="button" data-act="rot">轉向</button>
  <button type="button" data-act="put" class="ok">放好</button>
  <button type="button" data-act="del">收回</button>
  <button type="button" data-act="cancel">取消</button>
</div>
<div id="hsTip" role="status" aria-live="polite"></div>

//   新家具 vj_line（4×2）：右邊料斗擠出麵團／杯子蛋糕糊／餅乾麵團 → 輸送帶往左送 → 進磚砌小烤爐（爐口火光閃）→
//   烤好的點心從烤爐側門滑進前面的籃子，冒一點熱氣；煙囪冒白煙。圖是程式畫的像素圖（不抗鋸齒、自動描邊）；
//   集滿烘焙系列（proj 有 bakeline）才會動，否則是一件靜止的家具
const ANIM={},LSMOKE=[];
function drawLineSmoke(now){const t=reduceMotion.matches?0:now/1000;for(const c of LSMOKE)for(let q=0;q<3;q++){const u=((t*.42+q/3)%1),r=1.2+u*3,x0=c.x+Math.sin(u*4+q*2.3)*2.5*u+u*3,y0=c.y-4-u*26,al=Math.min(1,u*5)*(1-u);   // 一朵朵往上飄、變大變淡
    g.fillStyle=`rgba(160,140,146,${.85*al})`;for(let dy=-Math.ceil(r);dy<=Math.ceil(r);dy++){const w=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy)));g.fillRect(Math.round(x0-w),Math.round(y0+dy+1),w*2+1,1);}
    g.fillStyle=`rgba(255,255,255,${.95*al})`;for(let dy=-Math.ceil(r);dy<=Math.ceil(r)-1;dy++){const w=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy)))-1;if(w>=0)g.fillRect(Math.round(x0-w),Math.round(y0+dy),w*2+1,1);}}
  LSMOKE.length=0;}

    for(let k=0;k<5;k++){const c=(P.cs||['255,90,190','90,170,255'])[k%2],u=.15+R()*.7+(rm?0:.05*Math.sin(t*.4+k)),v=.2+R()*.6,p=quadPt(F,u,v),r=8+R()*10,f=rm?.7:.6+.4*Math.sin(t*(.6+R()*.8)+k*2);

// 【壁爐火光】找房間裡的壁爐／暖爐／火盆：前方地上一大片跳動的橘光（打光層）、火星往上飄、照亮附近家具與小人
function hearths(){const out=[];for(const o of items){const d=DEF[o.t];if(!d||d.kind!=='floor'||o===held?.it)continue;if(!/fireplace|stove|hearth|brazier|kamado/.test(o.t))continue;
  const [di,dj]=dims(o),dir=o.dir||0,fi=dir%2===0?o.i+di+1.2:o.i+di/2,fj=dir%2===0?o.j+dj/2:o.j+dj+1.2;out.push({i:fi,j:fj,o});}return out;}
function fireK(now,ph){if(reduceMotion.matches)return .8;return .72+.14*Math.sin(now/90+ph)*Math.sin(now/210+ph*2)+.14*Math.sin(now/47+ph*3);}
function drawFirePool(ctx,now,P,alpha,plain){for(const h of hearths()){const c=iso(h.i,h.j),k=fireK(now,h.o.j||0),R=(P.r||4)*Math.SQRT2*TW*(.92+.08*k);
  ctx.save();ctx.globalCompositeOperation='lighter';

  else ovalGlow(ctx,c.x,c.y,R*.75,[[0,`rgba(${P.c},${alpha*k})`],[.6,`rgba(${P.c},${alpha*k*.6})`],[.62,`rgba(${P.c},${alpha*k*.3})`],[1,`rgba(${P.c},0)`]]);   // 地上一圈有邊的火光

// 【中華・紅燈籠】（D：「有燈籠的紅光就很夠看了」）：房裡的燈全染成燈籠紅、照得更大更亮；燈旁一圈紅光暈會呼吸，
//   地上一片紅光跟著燈籠輕輕晃（月夜圓窗保持月光色，紅藍對比）
function redOf(L){const c=L.c.split(',').map(Number),m=[255,58,44];return {...L,c:c.map((v,q)=>Math.round(v*.45+m[q]*.55)).join(','),r:L.r*1.12,a:Math.min(1,L.a*1.05)};}
function redOn(){for(const P of projLayers())if(P.kind==='redlantern')return true;return false;}
function redLights(now){return lightList(now).filter(l=>l.t!=='window'&&l.t!=='moonwin');}
function drawRedPools(ctx,now,P,alpha,plain){if(plain)return;const rm=reduceMotion.matches;ctx.save();floorClip(ctx);ctx.globalCompositeOperation='lighter';
  for(const l of redLights(now)){const f=l.wall?{x:l.base.x+l.o.x*2.4,y:l.base.y+l.o.y*2.4}:l.base,ph=(l.it?.i??l.it?.c??0)*1.7+(l.it?.j??0)*.9,sw=rm?0:Math.sin(now/1700+ph)*TW*.28,r=(l.L.r||60)*(P.rk||.95),a=alpha*(P.pa||.38)*Math.min(1,l.fl);
    ovalGlow(ctx,f.x+sw,f.y,r,[[0,`rgba(255,96,70,${a})`],[.45,`rgba(240,50,40,${a*.55})`],[1,'rgba(200,20,30,0)']]);}
  ctx.restore();}
function drawRedHalo(now,P){const rm=reduceMotion.matches;g.save();g.globalCompositeOperation='lighter';
  for(const l of redLights(now)){const ph=(l.it?.i??l.it?.c??0)*1.3+(l.it?.j??0),br=rm?1:.85+.15*Math.sin(now/900+ph),R=(P.hr||26)*br,a=(P.ha||.55)*Math.min(1.1,l.fl);
    const gr=g.createRadialGradient(l.x,l.y,0,l.x,l.y,R);gr.addColorStop(0,`rgba(255,190,140,${a})`);gr.addColorStop(.25,`rgba(255,80,60,${a*.7})`);gr.addColorStop(1,'rgba(220,30,40,0)');g.fillStyle=gr;g.fillRect(l.x-R,l.y-R,R*2,R*2);}

function drawShimmer(now,P){const Z=shimmerZones(P);if(!Z.length)return;const t=now/1000,rm=reduceMotion.matches;

// 【湯煙】浴池冒出的白色湯煙：一團團往上飄、慢慢變大變淡（不壓過家具，淡淡的）

function projTick2(now){if(reduceMotion.matches)return;const r=Math.random;

      FX.push({x:p.x,y:p.y-(P.z||14),vx:(r()-.5)*.004+.002,vy:-.006-r()*.005,life:0,max:4200+r()*2600,type:'steam',ph:r()*6,c:P.c||'255,255,255',a:P.a||.16,big:P.big||1.6});}

function occGrid(){const occ=new Uint8Array(N*N);for(const o of items){const d=DEF[o.t];if(!d||d.kind!=='floor'||d.flat||o===held?.it)continue;const [di,dj]=dims(o);

// 【森林・翠蔭晨曦】陽光穿過樹梢灑在地上：亮亮的一片陽光裡，是一枝枝樹枝與一片片葉子形狀的影子，隨風搖；葉子會飄落
const LEAFSUN={};
function leafFrames(P){const r=(P.pool?.r)||5,key=r+'|'+(P.seed||3);if(LEAFSUN[key])return LEAFSUN[key];

    for(let q=0;q<9+Math.floor(R()*5);q++){const u=.12+q/14,sd=q%2?1:-1;lv.push({u,ang:sd*(.55+R()*.5),L:PPT*(1.1+R()*.6),W:.36+R()*.12,ph:R()*TAU});}
    br.push({a0,ang,len,lv,ph:R()*TAU,amp:.05+R()*.04,bend:(R()-.5)*.6});}
  const T=document.createElement('canvas');T.width=T.height=S;const tx=T.getContext('2d');
  const hw=Math.ceil(r*Math.SQRT2*TW),hh=Math.ceil(r*Math.SQRT2*TH),NF=P.nf||20,out=[],[cr,cg,cb]=(P.c||'255,236,170').split(',').map(Number);

      tx.lineWidth=3;tx.beginPath();tx.moveTo(0,0);tx.quadraticCurveTo(b.len*.5,b.bend*b.len*.25,b.len,0);tx.stroke();
      for(const l of b.lv){const x=l.u*b.len,y=b.bend*b.len*.25*4*l.u*(1-l.u)*.5;tx.save();tx.translate(x,y);tx.rotate(l.ang+.18*Math.sin(t*2+l.ph));
        tx.lineWidth=1.5;tx.beginPath();tx.moveTo(0,0);tx.lineTo(l.L*.18,0);tx.stroke();                                              // 葉柄
        tx.beginPath();tx.moveTo(l.L*.15,0);tx.bezierCurveTo(l.L*.35,-l.L*l.W,l.L*.8,-l.L*l.W*.6,l.L,0);tx.bezierCurveTo(l.L*.8,l.L*l.W*.6,l.L*.35,l.L*l.W,l.L*.15,0);tx.fill();   // 尖頭橢圓葉
        tx.restore();}

    const td=tx.getImageData(0,0,S,S).data,c=document.createElement('canvas');c.width=hw*2;c.height=hh*2;const cx=c.getContext('2d'),im=cx.createImageData(hw*2,hh*2),d=im.data;

      const u=Math.floor((di+r)*PPT),v=Math.floor((dj+r)*PPT),leaf=u>=0&&v>=0&&u<S&&v<S&&td[(v*S+u)*4+3]>110;
      let lv=rho<.55?1:rho<.78?.62:rho<.93?.32:.14;const edge=rho>.5&&rho<.6||rho>.73&&rho<.83||rho>.88&&rho<.98;if(edge&&bay[py&1][px&1]<2)lv=Math.min(1,lv+.3);   // 光池三階＋交界抖動
      const a=leaf?lv*.08:lv,o=(py*hw*2+px)*4;d[o]=cr;d[o+1]=cg;d[o+2]=cb;d[o+3]=a*255;}
    cx.putImageData(im,0,0);out.push(c);}
  return LEAFSUN[key]=out;}
function drawLeafSun(ctx,now,P,alpha,plain){if(plain)return;const pl=poolOf(P);if(!pl)return;const fr=leafFrames(P),n=fr.length,rm=reduceMotion.matches;
  const k=rm?0:Math.floor(now/(P.ms||170))%(n*2),idx=k<n?k:2*n-1-k,c=iso(pl.i,pl.j),im=fr[idx];   // 來回播放＝樹枝左右搖

// 周圍壓暗、光池保留（讓陽光那一片跳出來）
function drawVig(P){const pl=poolOf(P)||{i:N/2,j:N/2,r:N*.3},c=iso(pl.i,pl.j),R=pl.r*Math.SQRT2*TW*(P.rk||1.25);g.save();roomClip(g);g.globalCompositeOperation='multiply';
  g.fillStyle=`rgb(${P.c})`;const a=iso(0,0),b=iso(N,N),l=iso(0,N),r=iso(N,0);g.fillRect(l.x-4,a.y-WALL_H*Z2PX-4,r.x-l.x+8,b.y-a.y+WALL_H*Z2PX+8);g.restore();
  g.save();roomClip(g);g.globalCompositeOperation='lighter';const [cr,cg,cb]=P.c.split(',').map(Number),inv=`${255-cr},${255-cg},${255-cb}`;   // 光池範圍補回去
  ovalGlow(g,c.x,c.y,R,[[0,`rgba(${inv},.9)`],[.6,`rgba(${inv},.55)`],[1,`rgba(${inv},0)`]]);g.restore();}

// 【狼嚎・午夜狂想曲】舞台噴火：樂器區前方地上一排噴火口，跟著節奏輪流／齊發噴出像素火柱，整間被火光照亮，火星與黑煙往上散
// 【重低音】（狼嚎，D：「整個房間沒有那種重低音感」）：每一拍畫面震一下、音箱／鼓組鼓動、地上一圈圈音波往外擴、整間燈光跟著閃；齊噴火時大震
let BASS_IDX=-1,BIG_SHK=0;
function bassLayer(){for(const P of projLayers())if(P.kind==='bass')return P;return null;}
function bassTick(now){SHK.x=SHK.y=0;const P=bassLayer();if(!P||reduceMotion.matches)return;const bm=60000/P.bpm,idx=Math.floor(now/bm),b=beat(now,P);

function bolt(ctx,a,b,seed,w){const R=PRand(seed),n=Math.max(4,Math.round(Math.hypot(b.x-a.x,b.y-a.y)/6)),pts=[a];for(let k=1;k<n;k++){const u=k/n,j=(R()-.5)*Math.min(12,Math.hypot(b.x-a.x,b.y-a.y)*.25);pts.push({x:a.x+(b.x-a.x)*u+j,y:a.y+(b.y-a.y)*u+(R()-.5)*j});}pts.push(b);
  ctx.strokeStyle=`rgba(120,190,255,${.35*w})`;ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
  ctx.fillStyle=`rgba(235,248,255,${w})`;for(let k=1;k<pts.length;k++)pxLine(ctx,pts[k-1],pts[k]);}

  for(const s of T){ovalGlow(g,s.x,s.y,16+20*res,[[0,`rgba(140,200,255,${.45+.4*res})`],[1,'rgba(140,200,255,0)']]);
    if(!rm)for(let k=0;k<3;k++){const R=PRand(step*7+k*13),an=-Math.PI/2+(R()-.5)*2.6,L=10+R()*16;bolt(g,s,{x:s.x+Math.cos(an)*L,y:s.y+Math.sin(an)*L*.8},step*31+k,.8);}
    if(res>0){for(const m of M){if(Math.hypot(m.x-s.x,m.y-s.y)>260)continue;bolt(g,s,m,step*17+m.x|0,res);ovalGlow(g,m.x,m.y,14,[[0,`rgba(160,210,255,${.6*res})`],[1,'rgba(160,210,255,0)']]);}
      g.fillStyle=`rgba(90,140,255,${.12*res})`;roomClip(g);g.fillRect(-1e4,-1e4,2e4,2e4);}}

var PAINT_META={forest:{14:{w:460,h:388,ax:230,ay:261.03},18:{w:588,h:452,ax:294,ay:293.03},22:{w:716,h:516,ax:358,ay:325.03}},
 mermaid:{14:{w:460,h:388,ax:230,ay:261.03},18:{w:588,h:452,ax:294,ay:293.03},22:{w:716,h:516,ax:358,ay:325.03}}};
var PAINT={f:{},w:{}},PTOOL=null,PHOVER=null,PDRAG=null,PIMG={};
const paintOk=t=>Object.prototype.hasOwnProperty.call(PAINT_META,t);
function cleanPaint(p){const o={f:{},w:{}};if(p&&typeof p==='object'){
  for(const [c,t] of Object.entries(p.f||{}))if(/^\d{1,2}_\d{1,2}$/.test(c)&&paintOk(t))o.f[c]=t;
  for(const [c,t] of Object.entries(p.w||{}))if(/^[LR]\d{1,2}$/.test(c)&&paintOk(t))o.w[c]=t;}return o;}
function paintImg(t){const k=t+'_'+N;if(k in PIMG)return PIMG[k];PIMG[k]=null;if(!PAINT_META[t]||!PAINT_META[t][N])return null;
  const im=new Image();im.onload=()=>{PIMG[k]=im;};im.src='paint/'+k+'.png?v=510';return null;}
const P_WT=.32,P_CAP=10;   // 牆厚（格）、牆頂收邊（像素）
function wallPoly(side,c){const H=WALL_H*Z2PX,P=(a,b)=>side==='L'?iso(a,b):iso(b,a),U=(p,h)=>({x:p.x,y:p.y-h});
  const c0=c===0?-P_WT:c,c1=c===N-1?c+1+P_WT:c+1;   // 牆角和牆尾多包一點，連牆頂、牆的厚度一起換
  return [P(0,c0),P(0,c1),U(P(0,c1),H),U(P(-P_WT,c1),H+P_CAP),U(P(-P_WT,c0),H+P_CAP),U(P(0,c0),H)];}
function pPoly(pts){g.moveTo(pts[0].x,pts[0].y);for(let k=1;k<pts.length;k++)g.lineTo(pts[k].x,pts[k].y);g.closePath();}
function pTile(i,j){const p=iso(i,j);pPoly([p,{x:p.x+TW,y:p.y+TH},{x:p.x,y:p.y+2*TH},{x:p.x-TW,y:p.y+TH}]);}
function pCell(c){if(c.includes('_')){const [i,j]=c.split('_').map(Number);if(i<N&&j<N){pTile(i,j);return true;}return false;}
  const n=+c.slice(1);if(n<N){pPoly(wallPoly(c[0],n));return true;}return false;}
function paintDraw(t,cells,alpha){const im=paintImg(t),s=PAINT_META[t]&&PAINT_META[t][N];if(!im||!s)return;const o=iso(N/2,N/2);
  g.save();g.beginPath();let any=false;for(const c of cells)any=pCell(c)||any;
  if(any){g.clip();if(alpha)g.globalAlpha=alpha;g.drawImage(im,Math.round(o.x-s.ax),Math.round(o.y-s.ay),s.w,s.h);}g.restore();}
function drawPaint(){if(!PAINT)return;const by={};
  for(const [c,t] of Object.entries(PAINT.f))(by[t]=by[t]||[]).push(c);
  for(const [c,t] of Object.entries(PAINT.w))(by[t]=by[t]||[]).push(c);
  for(const t in by)paintDraw(t,by[t]);}
function drawPaintHover(){if(!PTOOL||!PHOVER||mode!=='edit')return;
  if(PTOOL.theme)paintDraw(PTOOL.theme,[PHOVER],.85);
  g.save();g.beginPath();pCell(PHOVER);g.fillStyle=PTOOL.theme?'rgba(255,255,255,.12)':'rgba(255,255,255,.3)';g.fill();
  g.setLineDash([3,2]);g.lineWidth=1.2;g.strokeStyle='#FF4F8B';g.stroke();g.restore();}
function wallAt(p){const side=p.x<O.x?'L':'R',c=side==='L'?(O.x-p.x)/TW:(p.x-O.x)/TW;if(c<0||c>=N)return null;
  const z=(O.y+c*TH-p.y)/Z2PX;return z>=-.05&&z<=WALL_H+.35?side+Math.floor(c):null;}
function paintCellAt(p){if(!PTOOL)return null;if(PTOOL.kind==='w')return wallAt(p);
  const [i,j]=toTile(p).map(Math.floor);return i>=0&&j>=0&&i<N&&j<N?i+'_'+j:null;}
function applyPaint(c){if(!c||!PTOOL)return false;const box=PTOOL.kind==='w'?PAINT.w:PAINT.f,t=PTOOL.theme;
  if(t?box[c]===t:!box[c])return false;if(t)box[c]=t;else delete box[c];return true;}
function paintChanged(){try{HOST&&HOST.paintChanged&&HOST.paintChanged(JSON.parse(JSON.stringify(PAINT)));}catch(e){}}
// 拿著壁紙／地板時：點一格貼一格、按住拖曳連續貼；從房間外面按住拖曳照樣移動視角；不會點到家具
cv.addEventListener('pointerdown',e=>{if(!PTOOL||mode!=='edit'||e.button!==0)return;const c=paintCellAt(toCanvas(e));if(!c)return;
  e.stopImmediatePropagation();PDRAG={ch:applyPaint(c)};try{cv.setPointerCapture(e.pointerId);}catch(_){}},true);
cv.addEventListener('pointermove',e=>{if(!PTOOL||mode!=='edit')return;if(drag&&!PDRAG)return;   // 正在拖曳視角
  const c=paintCellAt(toCanvas(e));PHOVER=c;cv.style.cursor=c?'crosshair':'';e.stopImmediatePropagation();
  if(PDRAG&&c&&applyPaint(c))PDRAG.ch=true;},true);
cv.addEventListener('pointerup',e=>{if(PDRAG){e.stopImmediatePropagation();const ch=PDRAG.ch;PDRAG=null;if(ch)paintChanged();return;}
  if(PTOOL&&mode==='edit'&&!(drag&&drag.moved)){e.stopImmediatePropagation();drag=null;$('stage').style.cursor='';}},true);
cv.addEventListener('pointerleave',()=>{PHOVER=null;});
addEventListener('keydown',e=>{if(e.key==='Escape'&&PTOOL){PTOOL=null;PHOVER=null;PDRAG=null;cv.style.cursor='';try{HOST&&HOST.paintDropped&&HOST.paintDropped();}catch(_){}}});   // 焦點在房間時按 Esc 也能放下
PAINT=cleanPaint(HOST&&HOST.initialPaint&&HOST.initialPaint());
for(const t of new Set([...Object.values(PAINT.f),...Object.values(PAINT.w)]))paintImg(t);
Object.assign(window.TTRoom,{
  paintTool(t){PTOOL=t&&(t.kind==='f'||t.kind==='w')?{kind:t.kind,theme:paintOk(t.theme)?t.theme:''}:null;PHOVER=null;PDRAG=null;cv.style.cursor='';
    if(PTOOL&&held)cancel();if(PTOOL&&PTOOL.theme)paintImg(PTOOL.theme);return !!PTOOL;},
  paint:()=>JSON.parse(JSON.stringify(PAINT)),
  setPaint(p){PAINT=cleanPaint(p);for(const t of new Set([...Object.values(PAINT.f),...Object.values(PAINT.w)]))paintImg(t);},
  paintFill(kind,theme){const box={};if(theme&&!paintOk(theme))return;   // 整間貼上／整間還原
    if(kind==='f'){if(theme)for(let i=0;i<N;i++)for(let j=0;j<N;j++)box[i+'_'+j]=theme;PAINT.f=box;}
    else{if(theme)for(const s of 'LR')for(let c=0;c<N;c++)box[s+c]=theme;PAINT.w=box;}
    if(theme)paintImg(theme);paintChanged();}});

})();
</script>
