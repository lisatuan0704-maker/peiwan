<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>氣泡試衣間｜小小酒館</title><link rel="stylesheet" href="tavern-ui/assets/fonts/lineseed.css"><link rel="stylesheet" href="lobby-ui/bubble-skins-preview.css?v=365"></head>
<body>
<header><div><p class="eyebrow">TINY TAVERN · LITTLE CONVERSATIONS</p><h1>把話說得可愛一點。</h1><p>九款酒館聊天氣泡，選一款，試著聊一句。</p></div><a class="preview-badge" href="bubble-design.html">配色工作台 ↗</a></header>
<main>
<section class="stage-panel" aria-label="酒館實景預覽">
 <div class="stage-top"><div><span class="dot"></span>酒館裡的樣子</div><button id="effects" aria-pressed="true">邊框流光：開</button></div>
 <div class="stage" id="stage"><div class="scene-shade"></div><div class="speaker"><div class="bubble cream" id="mainBubble"><span class="message">大家好！</span></div><canvas class="character" id="character" aria-label="酒館預覽角色"></canvas><span class="nameplate">小小闆闆</span></div><span class="stage-caption">字體大小一致 · 氣泡依文字自然延伸</span></div>
 <div class="composer"><label for="message">試著聊一句</label><div class="input-row"><input id="message" value="大家好！" autocomplete="off"><span id="count">2 / 18</span></div><div class="samples"><button data-text="安安">安安</button><button data-text="今天也一起玩吧！">日常招呼</button><button data-text="今天很開心認識大家下次再一起打遊戲好">18 字長句</button><button data-text="Hello 👋 一起玩嗎？">中英與表情</button></div></div>
</section>
<aside><p class="eyebrow">CHOOSE YOUR MOOD</p><h2>今天，想用哪一款？</h2><div id="skinList" class="skin-list" role="group" aria-label="氣泡皮膚"></div><details class="previous-skins"><summary>之前的六款簡約樣式</summary><div id="basicSkinList" class="skin-list" role="group" aria-label="簡約氣泡皮膚"></div></details><div class="skin-note"><strong id="selectedName">01 奶油原味</strong><p id="selectedDescription"></p></div><p class="local-note">只切換預覽，不會更動正式大廳。</p></aside>
<section class="comparison"><div class="section-title"><div><p class="eyebrow">SIDE BY SIDE</p><h2>同一句話，九種心情。</h2></div><p>跟著上方輸入一起更新</p></div><div id="comparisonGrid"></div></section>
</main><canvas id="doll" width="64" height="64" hidden></canvas>
<script src="tavern-ui/bubble-doll.js?v=362"></script><script src="lobby-ui/bubble-skins-preview.js?v=365"></script></body></html>
