<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵頻連線特效一覽</title>
<style>
:root{--ink:#1C2156;--pink:#FF4F8B;--mute:#5C6196;--paper:#fff;--line:#D3D8F2;--bg:#EEF1FB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Microsoft JhengHei','PingFang TC',system-ui,sans-serif}
header{padding:18px 20px 6px}
h1{margin:0 0 4px;font-size:22px}
header p{margin:0;color:var(--mute);font-size:14px;line-height:1.6}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;padding:14px 20px 30px;align-items:start}
@media (max-width:980px){.wrap{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:10px;box-shadow:4px 4px 0 #C9D2F5;cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card.on{box-shadow:4px 4px 0 var(--pink);border-color:var(--pink)}
.card h3{margin:8px 2px 2px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h3 span{font-size:12px;color:#fff;background:var(--ink);border-radius:999px;padding:1px 8px}
.card.on h3 span{background:var(--pink)}
.card p{margin:2px;font-size:12.5px;color:var(--mute);line-height:1.5}
.stage{display:block;width:100%;aspect-ratio:1;border-radius:10px;image-rendering:pixelated}
.dark .stage{background:radial-gradient(circle at 50% 60%,#2d2a5a,#120f2b 75%)}
.light .stage{background:radial-gradient(circle at 50% 60%,#ffffff,#dfe7fb 75%)}
aside{position:sticky;top:12px;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:5px 5px 0 #F7B6CC}
aside h2{margin:0 0 8px;font-size:17px}
.big{width:100%;aspect-ratio:1;border-radius:12px;image-rendering:pixelated;display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
button{border:2px solid var(--ink);border-radius:9px;background:#fff;color:var(--ink);font-weight:700;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:13px}
button.on,button.main{background:var(--pink);border-color:var(--pink);color:#fff}
.small{display:flex;gap:12px;align-items:flex-end;margin-top:8px;font-size:12px;color:var(--mute)}
.small canvas{image-rendering:pixelated;border-radius:8px}
textarea{width:100%;height:58px;font:12px/1.4 Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:6px}
#status{font-size:12px;color:var(--mute);min-height:16px}
</style>
</head>
<body class="dark">
<header>
  <h1>喵頻連線・科技感特效一覽</h1>
  <p>每張卡是一種特效，點卡片可以加進右邊的「組合預覽」。右邊可以切換背景、看大廳實際大小。選好按「複製選擇」貼給我。這頁只是預覽，不會改網站。</p>
</header>
<div class="wrap">
  <main class="grid" id="grid"></main>
  <aside>
    <h2>組合預覽</h2>
    <canvas class="big stage" id="big" width="400" height="400"></canvas>
    <div class="small"><div><canvas id="real" width="80" height="80" style="width:80px;height:80px"></canvas><br>大廳實際大小</div><div><canvas id="real2" width="160" height="160" style="width:160px;height:160px"></canvas><br>放大 2 倍</div></div>
    <div class="row"><button id="all">全部打開</button><button id="none">全部關閉</button><button id="bg">切換亮／暗背景</button><button id="slow">慢動作</button></div>
    <div class="row"><button id="copy" class="main">複製選擇</button></div>
    <textarea id="out" readonly></textarea>
    <div id="status">載入素材中…</div>
  </aside>
</div>
<script>
(()=>{'use strict';
const D='img/season-v292/meow/',BODY='img/outfit-studio-v280/body.png';
const HAIR={main:'#b7e6de',tail:'#a9d4ea'};
// 圖層順序同大廳：後髮→背飾→身體→衣服→外套→眼→眉→護目鏡→耳朵→前髮→耳環→耳機→手持物
const LAYERS=[['back','0.科技後髮(灰階).png',1],['acc1','1.科技下身披風.png'],['cable','2.身體後-科技電線.png'],['body',null],['cloth','5.科技窄裙套裝.png'],['coat','6.科技外套套裝.png'],['eye','3.科技眼睛.png'],['brow','3.科技眉毛.png'],['goggle','4.科技半透護目鏡.png'],['ear','7.科技耳朵.png'],['front','8.科技前髮(灰階).png',1],['earring','9.科技耳環.png'],['phone','10.科技耳機.png'],['box','11.手上物品.png']];
const FX=[
 {id:'sweep',name:'護目鏡掃光',desc:'每隔幾秒，一道白光斜斜掃過鏡片。'},
 {id:'spark',name:'訊號盒光點',desc:'手上訊號盒冒出青色光點往上飄、一閃一閃。'},
 {id:'flow',name:'電線資料流',desc:'亮點沿著連接線跑向接頭，像在傳資料。'},
 {id:'breath',name:'耳機呼吸燈',desc:'耳機與耳朵的發光處慢慢亮、慢慢暗。'},
 {id:'glitch',name:'故障閃爍',desc:'偶爾整隻角色錯位一下，帶紅藍色邊。'},
 {id:'scan',name:'全息掃描線',desc:'一條青色掃描線由上往下掃過全身。'},
 {id:'ring',name:'腳下訊號環',desc:'腳底下一圈一圈擴散的光環。'},
 {id:'wave',name:'頭頂訊號波',desc:'貓耳上方一段段冒出 Wi‑Fi 般的訊號弧線。'},
 {id:'orbit',name:'環繞資料方塊',desc:'幾顆小方塊繞著身體轉，轉到後面會被身體擋住。'},
 {id:'bits',name:'數字飄字',desc:'身邊偶爾浮出 0／1 小字往上飄散。'}
];
const S=80,OX=8,OY=12;   // 角色 64px 放在 80px 畫布中，留空間給頭頂與腳下特效
const load=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(Error(src));i.src=src;});
const cv=(w=S,h=S)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});g.imageSmoothingEnabled=false;return [c,g];};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function tint(img){ // 灰階髮依亮度上色，下段漸層到髮尾色
  const [c,g]=cv(128,128);g.drawImage(img,0,0);const d=g.getImageData(0,0,128,128),p=d.data;let y0=128,y1=0;
  for(let y=0;y<128;y++)for(let x=0;x<128;x++)if(p[(y*128+x)*4+3]){y0=Math.min(y0,y);y1=Math.max(y1,y);}
  const m=hex(HAIR.main),t=hex(HAIR.tail);
  for(let y=0;y<128;y++){const w=Math.max(0,Math.min(1,((y-y0)/Math.max(1,y1-y0)-.5)/.4));for(let x=0;x<128;x++){const i=(y*128+x)*4;if(!p[i+3])continue;const l=(0.299*p[i]+0.587*p[i+1]+0.114*p[i+2])/255,k=Math.min(1.25,l*1.18);
    for(let ch=0;ch<3;ch++){const base=m[ch]*(1-w)+t[ch]*w;p[i+ch]=Math.max(0,Math.min(255,l>.86?base+(255-base)*(l-.86)/.14*.8:base*k));}}}
  g.putImageData(d,0,0);return c;
}
let CP,L={},CH,CHR,CHC,maskOf={},cablePath=[],cableMax=1,bounds;
function layer64(src){const [c,g]=cv();g.drawImage(src,OX,OY,64,64);return c;}
function pix(c){return c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,S,S).data;}
async function init(){
  for(const [k,f,gray] of LAYERS){const img=await load(f?D+f:BODY);L[k]=layer64(gray?tint(img):img);}
  let g;[CH,g]=cv();for(const [k] of LAYERS)g.drawImage(L[k],0,0);
  const cp=CP=pix(CH);bounds={x0:S,x1:0,y0:S,y1:0};for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(cp[(y*S+x)*4+3]>80){bounds.x0=Math.min(bounds.x0,x);bounds.x1=Math.max(bounds.x1,x);bounds.y0=Math.min(bounds.y0,y);bounds.y1=Math.max(bounds.y1,y);}
  // 紅、青分色版（故障效果用）
  const mk=(r,gr,b)=>{const [c,gg]=cv();const d=gg.createImageData(S,S);for(let i=0;i<cp.length;i+=4){if(cp[i+3]>80){d.data[i]=r;d.data[i+1]=gr;d.data[i+2]=b;d.data[i+3]=170;}}gg.putImageData(d,0,0);return c;};
  CHR=mk(255,40,90);CHC=mk(40,230,255);
  for(const k of ['goggle','phone','ear','box','cable','earring'])maskOf[k]=pix(L[k]);
  // 電線：從最右邊（接頭）開始依連通距離排序
  const cm=maskOf.cable,seen=new Int32Array(S*S).fill(-1),q=[];let off=0;
  const pts=[];for(let i=0;i<S*S;i++)if(cm[i*4+3]>40)pts.push(i);
  pts.sort((a,b)=>(b%S)-(a%S)||(b-a));
  for(const s of pts){if(seen[s]>=0)continue;seen[s]=off;q.length=0;q.push(s);for(let h=0;h<q.length;h++){const i=q[h],x=i%S,y=(i/S)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=S||ny>=S)continue;const n=ny*S+nx;if(seen[n]>=0||cm[n*4+3]<=40)continue;seen[n]=seen[i]+1;q.push(n);}}off=Math.max(...q.map(i=>seen[i]))+3;}
  cablePath=pts.map(i=>({x:i%S,y:(i/S)|0,d:seen[i]}));cableMax=Math.max(1,...cablePath.map(p=>p.d));
}
// ---- 特效 ----
const rnd=s=>{s=Math.sin(s*12.9898)*43758.5453;return s-Math.floor(s);};
const P=(g,x,y,c,a=1,w=1,h=1)=>{g.globalAlpha=a;g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);g.globalAlpha=1;};
function sweep(g,t){const per=2600,u=(t%per)/900;if(u>1)return;const pos=-6+u*30+OX;const m=maskOf.goggle;
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){if(m[(y*S+x)*4+3]<60)continue;const v=Math.abs((x-22-OX+(y-28-OY)*0.8)-pos);if(v<1.2)P(g,x,y,'#ffffff',.9);else if(v<2.6)P(g,x,y,'#dffbff',.38);}}
function spark(g,t,st){const box=st.boxB||(st.boxB=bbox(maskOf.box));if(!box)return;
  const N=14;for(let k=0;k<N;k++){const per=1500,ph=(t+k*per/N)%per/per,seed=Math.floor((t+k*per/N)/per)*31+k;const x=box.x0+rnd(seed)*(box.x1-box.x0+4)-2,y=box.y0+3-ph*14-rnd(seed+7)*3;
    const a=Math.sin(ph*Math.PI)*(0.55+0.45*Math.sin(t/70+k));const c=rnd(seed+3)>.7?'#ffffff':'#5ff3ff';
    if(rnd(seed+5)>.82&&ph>.2&&ph<.7){P(g,x,y-1,c,a);P(g,x-1,y,c,a);P(g,x+1,y,c,a);P(g,x,y+1,c,a);P(g,x,y,'#fff',a);}else P(g,x,y,c,a);}}
function flow(g,t){const sp=cableMax+18,heads=[(t/22)%sp,((t/22)+sp/2)%sp];
  for(const p of cablePath)for(const h of heads){const k=h-p.d;if(k>=0&&k<5){P(g,p.x,p.y,k<1.5?'#ffffff':'#7ff6ff',k<1.5?.95:.65-(k/5)*.4);}}}
function breath(g,t){const a=.5+.5*Math.sin(t/520);
  for(const k of ['phone','ear','earring']){const m=maskOf[k];for(let i=0;i<S*S;i++){const j=i*4;if(m[j+3]<100)continue;const r=m[j],gg=m[j+1],b=m[j+2];if(gg>140&&b>170&&r<200){const x=i%S,y=(i/S)|0;P(g,x,y,'#e9ffff',a*.75);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=(y+dy)*S+x+dx;if(n>=0&&n<S*S&&maskOf[k][n*4+3]<30)P(g,x+dx,y+dy,'#6ff0ff',a*.35);}}}}}
function glitchOn(t){const per=3800,u=t%per;return u<240;}
function drawChar(g,t,on){
  if(on.glitch&&glitchOn(t)){const f=Math.floor(t/60);g.globalCompositeOperation='lighter';g.drawImage(CHR,-1-(f%2),0);g.drawImage(CHC,1+(f%2),0);g.globalCompositeOperation='source-over';
    for(let y=0;y<S;y+=3){const sh=rnd(f*7+y)>.72?Math.round((rnd(f+y)-.5)*6):0;g.drawImage(CH,0,y,S,3,sh,y,S,3);}}
  else g.drawImage(CH,0,0);}
function scan(g,t){const span=bounds.y1-bounds.y0+10,y=bounds.y0-5+((t/38)%(span+18));const cp=CP;
  for(let x=0;x<S;x++)for(let dy=0;dy<3;dy++){const yy=Math.round(y)-dy;if(yy<0||yy>=S)continue;if(cp[(yy*S+x)*4+3]>80)P(g,x,yy,dy?'#4ff0ff':'#d8ffff',dy?.22:.55);}}
function ring(g,t){const cx=(bounds.x0+bounds.x1)/2+1,cy=bounds.y1+.5;for(let k=0;k<2;k++){const u=((t/1700)+k/2)%1,rx=5+u*17,ry=rx*.28,a=(1-u)*.85;
  for(let s=0;s<64;s++){const an=s/64*Math.PI*2;P(g,cx+Math.cos(an)*rx,cy+Math.sin(an)*ry,u<.25?'#ffffff':'#58eaff',a);}}
  P(g,cx-6,cy,'#58eaff',.35,13,1);}
function wave(g,t){const per=1400,u=(t%per)/per;const cx=(bounds.x0+bounds.x1)/2+2,cy=bounds.y0+3;
  for(let k=0;k<3;k++){const show=u*3-k;if(show<0||show>1.6)continue;const r=3+k*3,a=Math.min(1,show*2)*(1-Math.max(0,show-1)/.6);
    for(let s=0;s<=10;s++){const an=-Math.PI*.78+s/10*Math.PI*.56;P(g,cx+Math.cos(an)*r,cy-2+Math.sin(an)*r,k===0?'#ffffff':'#6ff2ff',a*.9);}}}
function orbit(g,t,front){const cx=(bounds.x0+bounds.x1)/2+1,cy=(bounds.y0+bounds.y1)/2+6;
  for(let k=0;k<4;k++){const an=t/900+k*Math.PI/2,x=cx+Math.cos(an)*19,y=cy+Math.sin(an)*5-k%2*4,isFront=Math.sin(an)>0;if(isFront!==front)continue;
    const c=['#6ff2ff','#b79cff','#ffffff','#7fd3f5'][k];P(g,x-1,y-1,c,front?.95:.5,2,2);if(front)P(g,x-1,y-1,'#ffffff',.6);}}
const FONT={0:['111','101','101','101','111'],1:['010','110','010','010','111']};
function bits(g,t){for(let k=0;k<5;k++){const per=2200,ph=((t+k*440)%per)/per,seed=Math.floor((t+k*440)/per)*13+k;if(rnd(seed)<.35)continue;
  const x=Math.round(bounds.x0-6+rnd(seed+1)*(bounds.x1-bounds.x0+10)),y=Math.round(bounds.y0+8+rnd(seed+2)*24-ph*10),a=Math.sin(ph*Math.PI)*.8,f=FONT[rnd(seed+3)>.5?1:0];
  f.forEach((row,ry)=>[...row].forEach((v,rx)=>{if(v==='1')P(g,x+rx,y+ry,'#7ff6ff',a);}));}}
function bbox(m){let b=null;for(let i=0;i<S*S;i++)if(m[i*4+3]>40){const x=i%S,y=(i/S)|0;b=b||{x0:x,x1:x,y0:y,y1:y};b.x0=Math.min(b.x0,x);b.x1=Math.max(b.x1,x);b.y0=Math.min(b.y0,y);b.y1=Math.max(b.y1,y);}return b;}
function render(g,t,on,st){g.clearRect(0,0,S,S);
  if(on.ring)ring(g,t);if(on.orbit)orbit(g,t,false);
  drawChar(g,t,on);
  if(on.scan)scan(g,t);if(on.breath)breath(g,t);if(on.flow)flow(g,t);if(on.sweep)sweep(g,t);if(on.spark)spark(g,t,st);if(on.wave)wave(g,t);if(on.bits)bits(g,t);if(on.orbit)orbit(g,t,true);}
// ---- 頁面 ----
const picked=new Set(['sweep','spark','flow','breath']);
const cards=[];
function build(){const grid=document.getElementById('grid');
  for(const fx of FX){const el=document.createElement('div');el.className='card';el.innerHTML='<canvas class="stage" width="240" height="240"></canvas><h3>'+fx.name+'<span></span></h3><p>'+fx.desc+'</p>';
    el.onclick=()=>{picked.has(fx.id)?picked.delete(fx.id):picked.add(fx.id);sync();};grid.append(el);const [w,wg]=cv();cards.push({fx,el,out:el.querySelector('canvas').getContext('2d'),w,wg,st:{}});}
  sync();}
function sync(){for(const c of cards){const on=picked.has(c.fx.id);c.el.classList.toggle('on',on);c.el.querySelector('h3 span').textContent=on?'已加入':'加入組合';}
  document.getElementById('out').value=JSON.stringify({meowFx:FX.filter(f=>picked.has(f.id)).map(f=>f.name)});}
const [bw,bg]=cv(),bst={};let speed=1,last=performance.now(),clock=0;
function frame(now){clock+=(now-last)*speed;last=now;const t=clock;
  for(const c of cards){render(c.wg,t+c.fx.id.length*137,{[c.fx.id]:true},c.st);c.out.imageSmoothingEnabled=false;c.out.clearRect(0,0,240,240);c.out.drawImage(c.w,0,0,240,240);}
  const on=Object.fromEntries([...picked].map(k=>[k,true]));render(bg,t,on,bst);
  for(const [id,size] of [['big',400],['real',80],['real2',160]]){const o=document.getElementById(id).getContext('2d');o.imageSmoothingEnabled=false;o.clearRect(0,0,size,size);o.drawImage(bw,0,0,size,size);}
  requestAnimationFrame(frame);}
document.getElementById('all').onclick=()=>{FX.forEach(f=>picked.add(f.id));sync();};
document.getElementById('none').onclick=()=>{picked.clear();sync();};
document.getElementById('bg').onclick=()=>{document.body.classList.toggle('dark');document.body.classList.toggle('light');};
document.getElementById('slow').onclick=e=>{speed=speed===1?.35:1;e.target.classList.toggle('on',speed!==1);};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('out').value);document.getElementById('status').textContent='已複製，貼給我就好。';}catch(e){document.getElementById('out').select();document.getElementById('status').textContent='請手動複製上面框內文字。';}};
init().then(()=>{window.MeowFX={size:S,frame(t,ids){const [c,g]=cv();render(g,t,Object.fromEntries(ids.map(k=>[k,true])),{});return c.toDataURL();}};build();document.getElementById('status').textContent='點卡片加入或移出組合。';requestAnimationFrame(frame);}).catch(e=>{document.getElementById('status').textContent='素材載入失敗：'+e.message;});
})();
</script>
</body>
</html>
