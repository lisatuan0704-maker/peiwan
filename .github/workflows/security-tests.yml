name: Security rule tests
# 只跑資料庫規則測試（Firebase Database Emulator），不部署任何東西。
on:
  push:
    branches: ['sec-ci/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - name: Install emulator tools
        run: |
          npm i -g firebase-tools@13 >/dev/null
          mkdir -p ../../output/qa-runtime-v273
          cd ../../output/qa-runtime-v273 && npm init -y >/dev/null && npm i @firebase/rules-unit-testing@latest firebase@latest >/dev/null
      - name: Start emulators (9000 for rule suites, 9273 for page-level tests)
        shell: bash
        run: |
          # 一個一個啟動，避免同時下載模擬器檔案互相干擾
          for p in 9000 9273; do
            mkdir -p /tmp/emu$p && cd /tmp/emu$p
            echo "{\"emulators\":{\"database\":{\"port\":$p,\"host\":\"127.0.0.1\"},\"ui\":{\"enabled\":false},\"hub\":{\"port\":$((p+400))},\"logging\":{\"port\":$((p+500))}},\"database\":{\"rules\":\"r.json\"}}" > firebase.json
            echo '{"rules":{".read":false,".write":false}}' > r.json
            nohup firebase emulators:start --only database --project demo-tt-$p > log.txt 2>&1 &
            for i in $(seq 1 90); do curl -s -o /dev/null "http://127.0.0.1:$p/.json?ns=x" && break; sleep 2; done
            curl -s -o /dev/null "http://127.0.0.1:$p/.json?ns=x" || { cat log.txt; exit 1; }
          done
      - name: Rule suites (phase 1-5)
        shell: bash
        run: |
          rc=0; bash tests/security-rules-v428/run.sh > /tmp/rs.txt 2>&1 || rc=$?
          cat /tmp/rs.txt; echo "::notice title=rule suites::$(grep -E 'passed|PASS|FAIL|✗|Error' /tmp/rs.txt | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3000)"
          exit $rc
      - name: Phase 5 detail
        if: always()
        shell: bash
        run: |
          cd tests/security-rules-v428 && rc=0; node test-phase5.cjs rules-before-v466.json ../../security/database.rules.json > /tmp/p5.txt 2>&1 || rc=$?
          echo "::notice title=phase5::$(tr '\n' ' ' < /tmp/p5.txt | cut -c1-3500)"; exit $rc
      - name: Page-level payment tests with new rules
        if: always()
        shell: bash
        run: |
          rc=0
          for t in tests/security-v428.cjs tests/base-parts-v434.cjs; do
            node $t > /tmp/out.txt 2>&1 || rc=1
            # 結果以標註回報（摘要可用 gh run view 讀到）
            tail -c 3000 /tmp/out.txt | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-2500 | sed "s|^|::warning title=$t::|"; echo
          done
          exit $rc
