<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>當季套組配色調整</title>
<style>
:root{--ink:#1C2156;--pink:#FF4F8B;--mute:#5C6196}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Microsoft JhengHei',system-ui,sans-serif;background:#2E1C26;color:var(--ink)}
body{display:grid;grid-template-columns:1fr 330px;height:100vh}
#wrap{position:relative;overflow:hidden;display:grid;place-items:center;background:#1E1218}
#view{border:0;background:#000;transform-origin:50% 50%}
aside{background:#fff;border-left:3px solid var(--ink);padding:14px 16px;overflow:auto}
h1{font-size:18px;margin:0 0 6px}
p.help{font-size:12px;color:var(--mute);margin:0 0 12px;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
button{border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);font-weight:700;padding:6px 10px;cursor:pointer;font-family:inherit}
button.on,button.main{background:var(--pink);color:#fff}
fieldset{border:2px solid #D3D8F2;border-radius:10px;margin:0 0 12px;padding:8px 12px 10px}
legend{font-weight:900;font-size:14px;padding:0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;font-size:14px;font-weight:700}
.row label{display:flex;align-items:center;gap:6px}
input[type=color]{width:54px;height:32px;border:2px solid var(--ink);border-radius:6px;padding:1px;background:#fff;cursor:pointer}
input[type=color]:disabled{opacity:.35;cursor:default}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{padding:0;height:30px;border-radius:7px}
textarea{width:100%;height:110px;font:12px/1.4 Consolas,monospace;border:2px solid #C9CDF0;border-radius:8px;padding:6px}
#status{font-size:12px;color:var(--mute);min-height:18px}
</style>
</head>
<body>
<div id="wrap"><iframe id="view" title="大廳預覽"></iframe></div>
<aside>
  <h1>當季套組配色調整</h1>
  <p class="help">右邊是真正的商城。調整只影響「當季套組」卡片上的展示人物髮色與卡片背景，不會改到試穿、穿搭、染髮券或價格。這頁只在你的瀏覽器預覽，不會改網站；調好按「複製數據」貼給我。</p>
  <div class="btns" id="sets"><button data-id="season291_bear" class="on">熊熊偵探</button><button data-id="season291_wolf">龐克搖滾狼</button><button data-id="season283_devil">中華小惡魔</button><button data-id="season283_valentine">心動情人</button></div>
  <fieldset><legend>展示髮色</legend>
    <div class="row"><span>主色</span><input type="color" id="main"></div>
    <div class="row"><label><input type="checkbox" id="useTail">髮尾漸層</label><input type="color" id="tail"></div>
    <div class="row"><label><input type="checkbox" id="useHl">挑染</label><input type="color" id="hl"></div>
  </fieldset>
  <fieldset><legend>卡片背景</legend>
    <div class="row"><label><input type="radio" name="bgm" value="auto" checked>跟著髮色</label><label><input type="radio" name="bgm" value="custom">自己選</label></div>
    <div class="row"><span>三段漸層</span><span><input type="color" id="bg0"> <input type="color" id="bg1"> <input type="color" id="bg2"></span></div>
  </fieldset>
  <fieldset><legend>快速配色（點了再微調）</legend><div class="presets" id="presets"></div></fieldset>
  <div class="btns"><button id="reset">還原這套</button><button id="copy" class="main">複製數據</button></div>
  <textarea id="out" readonly></textarea>
  <div id="status">載入中…</div>
</aside>
<script>
(()=>{
const $=id=>document.getElementById(id);const view=$('view');
const DEFAULTS={season291_bear:{main:'#5D72B1',tail:'#AECFDB',highlight:'#63C3CA',bg:['#95A5D6','#16ADE3','#096167']},season291_wolf:{main:'#120D1C',tail:'#812C5A',highlight:'#D2A1F2',bg:['#BBABD8','#B325DA','#9F3C5F']},season283_devil:{main:'#D2566F',tail:'#52192A',highlight:'#F2EAD8',bg:['#A08895','#E81756','#510B0B']},season283_valentine:{main:'#F7EFD4',tail:'#F0CCE5',highlight:'#FFE0EC',bg:['#FEF69F','#FECD62','#E70DA2']}};
const PRESETS=[['奶茶金','#E2B676','#9C6B3A','#FFF1D6'],['焦糖棕','#B97A4A','#6E3F25','#F2C28B'],['蜂蜜粉','#F3B3C8','#C46A8E','#FFF0F5'],['薰衣草','#B6A2F0','#6F58C9','#F4D8FF'],['冰河銀','#DDE3F0','#8E9AB8','#9FD8FF'],['龐克灰','#9A9AAE','#4C4C60','#FF5C8F'],['午夜藍','#5D72C8','#232E66','#8FE3FF'],['薄荷綠','#9FDCC0','#4E9A7E','#FFF6C9']];
let current='season291_bear';
let state=(()=>{try{return JSON.parse(localStorage.getItem('tt_season_color_v402')||'null')||{}}catch(e){return {}}})();
function cfg(id){const d=DEFAULTS[id];return state[id]||{main:d.main,tail:d.tail,highlight:(d.bg&&!/^season283/.test(id))?d.highlight:null,bg:d.bg||null};}
function save(){try{localStorage.setItem('tt_season_color_v402',JSON.stringify(state))}catch(e){}}
function size(){const wrap=$('wrap').getBoundingClientRect(),W=1366,H=768;view.style.width=W+'px';view.style.height=H+'px';view.style.transform='scale('+Math.min(1,(wrap.width-16)/W,(wrap.height-16)/H)+')';}
addEventListener('resize',size);size();
const okHost=/(^|\.)tinytavern\.tw$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
if(!okHost){$('wrap').innerHTML='<div style="color:#fff;text-align:center;line-height:1.9;font-size:16px;padding:20px">這頁要在網站上開才能控制商城。<br>請先 Push，再打開<br><a style="color:#FF8DB5;font-weight:900" href="https://tinytavern.tw/season-color-adjust.html" target="_blank">https://tinytavern.tw/season-color-adjust.html</a></div>';$('status').textContent='目前不是在 tinytavern.tw 上開啟。';}
else view.src='lobby-view.html?preview=1';
function lobbyWin(){try{return view.contentDocument.getElementById('tavernView').contentWindow}catch(e){return null}}
function shopWin(){try{const outer=lobbyWin().document.querySelector('#ttApprovedUI iframe');return outer.contentDocument.getElementById('shopFrame').contentWindow}catch(e){return null}}
function fill(){const c=cfg(current),d=DEFAULTS[current];$('main').value=c.main;$('useTail').checked=!!c.tail;$('tail').value=c.tail||d.tail;$('tail').disabled=!c.tail;$('useHl').checked=!!c.highlight;$('hl').value=c.highlight||d.highlight;$('hl').disabled=!c.highlight;
 const custom=Array.isArray(c.bg);document.querySelector('input[name=bgm][value='+(custom?'custom':'auto')+']').checked=true;const bg=custom?c.bg:[c.main,c.tail||c.main,c.highlight||c.tail||c.main];['bg0','bg1','bg2'].forEach((id,i)=>{$(id).value=bg[i];$(id).disabled=!custom;});}
function read(){const custom=document.querySelector('input[name=bgm]:checked').value==='custom';state[current]={main:$('main').value,tail:$('useTail').checked?$('tail').value:null,highlight:$('useHl').checked?$('hl').value:null,bg:custom?[$('bg0').value,$('bg1').value,$('bg2').value]:null};save();fill();apply();}
function apply(){const all={};for(const id of Object.keys(DEFAULTS))all[id]=cfg(id);$('out').value=JSON.stringify({seasonDisplay:all});const w=shopWin();if(!w||!w.__ttSeasonRepaint){$('status').textContent='等商城載入…';return false;}w.TTSeasonDisplay=Object.assign(w.TTSeasonDisplay||{},all);w.__ttSeasonRepaint();$('status').textContent='已套用到商城預覽。';return true;}
['main','tail','hl','bg0','bg1','bg2'].forEach(id=>$(id).addEventListener('input',read));['useTail','useHl'].forEach(id=>$(id).addEventListener('change',read));document.querySelectorAll('input[name=bgm]').forEach(r=>r.addEventListener('change',read));
$('sets').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;current=b.dataset.id;[...$('sets').children].forEach(x=>x.classList.toggle('on',x===b));fill();apply();try{shopWin().document.querySelector('[data-season="'+current+'"]')?.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}});
$('presets').innerHTML=PRESETS.map((p,i)=>'<button data-p="'+i+'" title="'+p[0]+'" style="background:linear-gradient(135deg,'+p[1]+','+p[2]+' 70%,'+p[3]+')"></button>').join('');
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=PRESETS[b.dataset.p];state[current]={main:p[1],tail:p[2],highlight:p[3],bg:null};save();fill();apply();});
$('reset').onclick=()=>{delete state[current];save();fill();apply();};
$('copy').onclick=async()=>{apply();try{await navigator.clipboard.writeText($('out').value);$('status').textContent='已複製，貼給我就好。';}catch(e){$('out').select();$('status').textContent='請手動複製下方框內文字。';}};
fill();
if(okHost){let tries=0;const t=setInterval(()=>{const w=lobbyWin();try{if(w&&w.TinyTavernUI&&!shopWin())w.TinyTavernUI.open('shop');}catch(e){}if(apply()||++tries>40)clearInterval(t);if(tries>40)$('status').textContent='商城沒載入成功：請用 tinytavern.tw 上的這一頁開。';},1000);}
})();
</script>
</body>
</html>
